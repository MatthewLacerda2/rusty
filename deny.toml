# The CI `deny` job is a BLOCKING gate (no continue-on-error): a new RUSTSEC
# advisory or a non-allow-listed license fails the build. Override only by adding
# a reviewed, deliberate `ignore`/`allow` entry here — never by relaxing CI.
# The graph is every feature, not the default set: `dev` brings dependencies of its
# own (the provider client, #383) that a default-features scan never sees, and a
# license nobody checked is a license nobody allowed.
[graph]
all-features = true

[advisories]
yanked = "warn"
ignore = [
  # `ttf-parser` is unmaintained. rusty no longer uses it: UI `Text` moved to
  # `skrifa` + `harfrust` (#1328). It stays in the tree only through winit →
  # sctk-adwaita → ab_glyph (Wayland client-side window decorations), which
  # draws the window title with it. It parses system fonts there, not untrusted
  # input, and it is NOT a vulnerability. Exit condition: drop this when
  # sctk-adwaita moves off ab_glyph, or if winit's decoration feature is ever
  # turned off (that changes Wayland window titles: the operator's call).
  # Real RUSTSEC vulnerabilities still fail the deny job.
  "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Design locks (#975), each a rule from CLAUDE.md that held by accident until now:
# - "Use `glam` for all math": nalgebra is in the tree only for the physics stack
#   (rapier3d, and glamx's conversions to it), so naming it directly fails;
#   cgmath is not in the tree at all. A wrapper is a crate allowed to depend on it.
deny = [
  { crate = "nalgebra", wrappers = ["rapier3d", "glamx"], reason = "rusty uses glam for all math (CLAUDE.md); nalgebra is the physics stack's own" },
  { crate = "cgmath", reason = "rusty uses glam for all math (CLAUDE.md)" },
]

[licenses]
# Explicit allow-list: a dependency under any other license fails CI. Add a
# license here only as a reviewed, deliberate decision.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-DFS-2016", "Unicode-3.0", "MPL-2.0", "CC0-1.0",
  # Boost Software License — permissive, OSI-approved. Reaches us via the winit
  # clipboard path (clipboard-win, error-code).
  "BSL-1.0",
  # Permissive font licenses for the default fonts egui's `epaint` bundles
  # (SIL Open Font License, Ubuntu Font Licence — SPDX `Ubuntu-font-1.0` since egui
  # 0.36). They cover font assets, not code.
  "OFL-1.1", "Ubuntu-font-1.0",
]
confidence-threshold = 0.8
# Skip our own unpublished crate (`publish = false`); it has no license field and
# we never ship it to a registry. Dependencies are still fully gated.
private = { ignore = true }
# `midly` (Standard MIDI File parsing, pulled in by zimmer, #413) is released under
# the Unlicense — an OSI-approved public-domain dedication. Allowed for that one
# crate rather than added to the list above, so a new Unlicense dependency is still
# a reviewed decision.
#
# `webpki-roots` (Mozilla's CA bundle, compiled in by `ureq`'s `rustls` for the
# dev-only provider client, #383) is under CDLA-Permissive-2.0, a permissive *data*
# license for the certificate list. Allowed for that one crate, for the same reason.
exceptions = [
  { crate = "midly", allow = ["Unlicense"] },
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[sources]
# Crates come from crates.io, plus exactly one git repository: scorsese, for the
# `zimmer` synthesiser behind `Sound.*` (#413), pinned to a commit in Cargo.toml.
# Any other git source or registry fails the deny job — add one here only as a
# reviewed, deliberate decision. scorsese is licensed `MIT OR Apache-2.0`
# (scorsese#591), which the allow-list above already covers; it is public, so CI
# fetches it without credentials (if it ever goes private, CI needs a token).
unknown-registry = "deny"
unknown-git = "deny"
# Every git dependency names a commit (`rev = …`), never a branch or a tag (#975):
# zimmer's SYNTH_VERSION moves when a recipe would render differently, so rusty's
# bakes change only when someone moves the pin on purpose (CLAUDE.md, #413).
required-git-spec = "rev"
allow-git = ["https://github.com/MatthewLacerda2/scorsese"]
