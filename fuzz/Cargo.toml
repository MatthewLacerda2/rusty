# cargo-fuzz target crate (#119). Deliberately its OWN workspace (the empty
# `[workspace]` table below) so the root build, the determinism guard and
# cargo-deny never see it: running libFuzzer is nightly-only. Its compile is
# still a gate, on the pinned stable toolchain: `make fuzz-check` (CI's
# `fuzz-check` job), against `Cargo.lock` here, which `make fuzz-lock`
# re-resolves from the root lock and `make fuzz-lock-sync` holds in step with
# it. Run it on demand:
#   cargo +nightly fuzz run scene_deserialize
[package]
name = "rusty-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
# Its own workspace, so the engine's licence is named here, not inherited.
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.rusty]
path = ".."

[[bin]]
name = "scene_deserialize"
path = "fuzz_targets/scene_deserialize.rs"
test = false
doc = false
bench = false

[workspace]
