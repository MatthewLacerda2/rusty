# cargo-fuzz target crate (#119). Deliberately its OWN workspace (the empty
# `[workspace]` table below) so the root build, the determinism guard and
# cargo-deny never see it: running libFuzzer is nightly-only. Its compile is
# still a gate, on the pinned stable toolchain: `make fuzz-check` (CI's
# `fuzz-check` job), against `Cargo.lock` here, which is derived from the root
# lock each run (`make fuzz-lock`) and gitignored. Run it on demand:
#   make fuzz-lock && cargo +nightly fuzz run <target>   (scene_deserialize, model_import)
[package]
name = "rusty-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
# Its own workspace, so the engine's licence is named here, not inherited.
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
# The fuzz-only crates, pinned exactly: no lock pins them (the derived lock
# takes every other version from the root's), so a release can't move them.
# `arbitrary` is libfuzzer-sys's, listed only to pin it.
libfuzzer-sys = "=0.4.13"
arbitrary = "=1.5.0"
serde_json = "1"
glam = "0.33"

[dependencies.rusty]
path = ".."

[[bin]]
name = "scene_deserialize"
path = "fuzz_targets/scene_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_import"
path = "fuzz_targets/model_import.rs"
test = false
doc = false
bench = false

[workspace]

# The engine's patched Lua (the root `Cargo.toml` says why): a fuzzed script walks as Play does.
[patch.crates-io]
lua-src = { path = "../vendor/lua-src" }
