# Local commit gate. Install once per clone:  lefthook install
# Runs the same checks as CI (.github/workflows/lint.yml). Bypass in a pinch with
# `git commit --no-verify`, but CI re-runs it and gates the PR.
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    size:
      glob: "*.rs"
      run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- {staged_files}
    clippy:
      # Hard gate, mirroring CI: every warning fails, and the 50-line function cap
      # (clippy::too_many_lines) is denied crate-wide. The legacy burn-down is
      # complete (#124): no `#[allow(clippy::too_many_lines)]` remain — split, don't
      # silence. Default features here for speed; CI also runs the dev feature set.
      run: cargo clippy --quiet --all-targets --no-deps -- -D warnings -D clippy::too_many_lines
