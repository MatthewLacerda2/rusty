# Local commit gate. Install once per clone:  lefthook install
# Runs the same checks as CI (.github/workflows/lint.yml). Bypass in a pinch with
# `git commit --no-verify`, but CI re-runs it and gates the PR.
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    size:
      glob: "*.rs"
      run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- {staged_files}
    clippy:
      # Report-only locally (CI is the hard gate). CI runs:
      #   cargo clippy --all-targets -- -D warnings -D clippy::too_many_lines
      # for both feature sets, so the 50-line function cap is enforced there. The
      # `-W clippy::too_many_lines` below surfaces over-cap functions locally too;
      # the trailing `|| true` keeps the commit unblocked.
      run: cargo clippy --quiet --no-deps -- -W clippy::too_many_lines 2>&1 | tee .lint/clippy.txt || true
