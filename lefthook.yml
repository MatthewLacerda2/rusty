# Local commit gate. Install once per clone:  lefthook install
# Runs the same checks as CI (.github/workflows/lint.yml). Bypass in a pinch with
# `git commit --no-verify`, but CI re-runs it and gates the PR.
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    size:
      glob: "*.rs"
      run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- {staged_files}
    clippy:
      # Hard gate, mirroring CI: every warning fails, plus the 50-line function cap
      # (clippy::too_many_lines). The ~45 legacy offenders are grandfathered with
      # `#[allow(clippy::too_many_lines)]` and burned down in #124.
      run: cargo clippy --quiet --no-deps --all-targets -- -W clippy::too_many_lines -D warnings
