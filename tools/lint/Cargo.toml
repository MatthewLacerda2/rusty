[package]
name = "lint"
version = "0.1.0"
edition = "2021"
# Its own workspace, so the engine's licence is named here, not inherited.
license = "MIT OR Apache-2.0"

# Standalone — do not absorb into (or get absorbed by) the engine crate.
[workspace]

[[bin]]
name = "lint"
path = "src/main.rs"

# Held to the policy it enforces (#935): clippy-gated by `make clippy`, and the same
# nothing-temporary denies as the engine's `[lints]`.
[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Optimised dev builds: the passes are std string iteration, several times slower at
# opt-level 0, and `make`, the session hook, `make test-lint` and CI all share this one
# build. Level 2 measured the smallest cold compile plus passes; 3 was no faster.
[profile.dev]
opt-level = 2
