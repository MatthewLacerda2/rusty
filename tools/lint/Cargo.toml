[package]
name = "lint"
version = "0.1.0"
edition = "2021"

# Standalone — do not absorb into (or get absorbed by) the engine crate.
[workspace]

[[bin]]
name = "lint"
path = "src/main.rs"

# Held to the policy it enforces (#935): clippy-gated by `make clippy`, and the same
# nothing-temporary denies as the engine's `[lints]`.
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
