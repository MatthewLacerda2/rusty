# cargo-mutants' configuration, read from here by every run (mutants-on-request.yml,
# and `cargo mutants` run by hand). The engine is a workspace being split one crate per module
# (crates/CLAUDE.md), and the tests that would catch a mutant in a moved crate are
# mostly the root package's, so every mutant runs the whole workspace's tests, as it
# did when the engine was one crate; an on-request run narrows that to the packages
# that depend on the mutated one (`mutants-request.py`). The workflow passes `--workspace` so mutants are
# drawn from every member, not only the root package. cargo-mutants' own baseline
# ignores this and tests only the mutated packages, so the workflow runs its own
# (`--baseline skip`; docs/testing.md, *Mutation testing*).
test_workspace = true

# Test fixture compiled as normal code, so other crates' tests can reach it: a mutant
# there changes what a test feeds the World, never what the engine does, so no test
# is owed for it (crates/CLAUDE.md, *Test hooks*).
exclude_globs = [
  "crates/ai/src/perception/bench.rs",
  "crates/ai/src/perception/test_world.rs",
  "crates/ai/src/query/bench.rs",
  "crates/ai/src/query/test_world.rs",
  "crates/app/src/animation/posed.rs",
  "crates/app/src/scene_load/project_fixture.rs",
  "crates/audio/src/recording.rs",
  "crates/dev/src/bench/rig.rs",
  "crates/ecs/src/changes/ops.rs",
  "crates/lighting/src/lightmap/trace/bench.rs",
  "crates/lighting/src/occlusion/bench/**",
  "crates/lighting/src/occlusion/test_gap.rs",
  "crates/lighting/src/occlusion/test_level.rs",
  "crates/lighting/src/placement/test_level.rs",
  "crates/lighting/src/placement/test_sites.rs",
  "crates/navigation/src/test_support.rs",
  "crates/physics/src/query/convex_fixture.rs",
  "crates/render/src/test_gpu.rs",
  "crates/render/src/test_gpu/**",
  "crates/edit/src/asset_instance/collision/chair.rs",
  "crates/edit/src/asset_instance/humanoid_fixture.rs",
  "crates/scene/src/skeleton/rig.rs",
  "crates/scene/src/state/marks.rs",
]

# A `#[serde(default = "f")]` function returns the value a dropped stored key loads:
# a design choice a test could only repeat, while `components::registry::default_drift`
# holds, for every component, that a dropped key loads the component's `Default`. So
# these are never mutated. cargo-mutants matches each regex against a mutant's name as
# `--list` prints it (file, line, function), so there is one line per file naming its
# default functions. Generated: `python3 .github/scripts/mutants_serde_defaults.py`
# prints them, and `make scripts` fails when this list drifts from it.
exclude_re = [
  '^crates/asset/src/animation_graph/layer\.rs:\d+:\d+: replace (full_weight) -> ',
  '^crates/asset/src/animation_graph/montage\.rs:\d+:\d+: replace (default_blend|default_slot) -> ',
