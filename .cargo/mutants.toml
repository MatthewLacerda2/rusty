# cargo-mutants' configuration, read from here by every run (mutants-on-request.yml,
# mutants-sweep.yml). The engine is a workspace being split one crate per module
# (crates/CLAUDE.md), and the tests that would catch a mutant in a moved crate are
# mostly the root package's, so every mutant runs the whole workspace's tests, as it
# did when the engine was one crate. The workflows pass `--workspace` so mutants are
# drawn from every member, not only the root package. cargo-mutants' own baseline
# ignores this and tests only the mutated packages, so the workflows run their own
# (`--baseline skip`; docs/testing.md, *Mutation testing*).
test_workspace = true

# Test fixture compiled as normal code, so other crates' tests can reach it: a mutant
# there changes what a test feeds the World, never what the engine does, so no test
# is owed for it (crates/CLAUDE.md, *Test hooks*).
exclude_globs = [
  "crates/ai/src/perception/bench.rs",
  "crates/ai/src/perception/test_world.rs",
  "crates/ai/src/query/bench.rs",
  "crates/ai/src/query/test_world.rs",
  "crates/app/src/animation/posed.rs",
  "crates/app/src/scene_load/project_fixture.rs",
  "crates/audio/src/recording.rs",
  "crates/ecs/src/changes/ops.rs",
  "crates/navigation/src/test_support.rs",
  "crates/physics/src/query/convex_fixture.rs",
  "crates/render/src/test_gpu.rs",
  "crates/render/src/test_gpu/**",
  "crates/scene/src/asset_instance/collision/chair.rs",
  "crates/scene/src/asset_instance/humanoid_fixture.rs",
  "crates/scene/src/lighting/lightmap/trace/bench.rs",
  "crates/scene/src/lighting/occlusion/bench/**",
  "crates/scene/src/lighting/occlusion/test_gap.rs",
  "crates/scene/src/lighting/occlusion/test_level.rs",
  "crates/scene/src/lighting/placement/test_level.rs",
  "crates/scene/src/lighting/placement/test_sites.rs",
  "crates/scene/src/skeleton/rig.rs",
]
