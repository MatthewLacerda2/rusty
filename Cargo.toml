[package]
name = "rusty"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = { version = "0.29.10" }
wgpu = { version = "0.19.4" }
egui = { version = "0.27.2" }
egui-wgpu = { version = "0.27.2" }
egui-winit = { version = "0.27.2", default-features = false, features = ["clipboard", "links"] }
mlua = { version = "0.9.2", features = ["lua54", "vendored"] }
glam = { version = "0.25.0", features = ["bytemuck"] }
image = { version = "0.24.9", default-features = false, features = ["png", "tga"] }
tobj = { version = "4.0.2" }
bytemuck = { version = "1.16.1", features = ["derive"] }
env_logger = "0.11.3"
log = "0.4.22"
pollster = "0.4.0"
