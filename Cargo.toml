# The engine is a workspace being split into one crate per top-level module
# (`rusty-<module>` under `crates/<module>/`); crates/CLAUDE.md is the recipe for
# moving the next one. This root package keeps the modules not yet moved, the
# binaries and the integration tests, and re-exports each moved crate under its
# module's old name (`src/lib.rs`), so `crate::core::…` and `rusty::core::…` paths
# keep compiling.
[workspace]
members = ["crates/*"]
# Every member, so a plain `cargo build`, `clippy`, `nextest run`, `doc` or `test`
# from the root (each `make` gate and CI step) covers the moved crates' own code
# and tests too, not only the root package.
default-members = [".", "crates/*"]
resolver = "2"

# What every member inherits (`version.workspace = true`, …).
[workspace.package]
version = "0.1.0"
edition = "2021"
# This is the engine application itself, not a library we publish to crates.io.
# `publish = false` also lets the cargo-deny license gate skip our own crates
# (via `[licenses] private.ignore`) while still gating every dependency.
publish = false

[package]
name = "rusty"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Integration tests build as ONE binary, not one per `tests/*.rs` (#483): each of those
# linked the whole engine (wgpu, egui, rapier, Lua). See the `[[test]]` target below.
autotests = false
# A plain `cargo run` opens the editor; the other binaries are named with `--bin`.
default-run = "rusty"

[lib]
name = "rusty"
path = "src/lib.rs"

# The editor. Needs the `editor` feature (on by default).
[[bin]]
name = "rusty"
path = "src/main.rs"
required-features = ["editor"]

# The standalone player (#431): boots the project's startup scene straight into Play
# with no editor. What a game ships as — build it with `--no-default-features` so the
# editor (egui) is stripped, the same way `dev` strips the harness.
[[bin]]
name = "player"
path = "src/bin/player.rs"

# Headless deterministic runner (the agent's hands). Dev-only: stripped from ship
# builds. Build/run with `--features dev`.
[[bin]]
name = "play"
path = "src/bin/play.rs"
required-features = ["dev"]

# Ship a project (#1267): refresh the import cache, copy the runtime files, leave the
# convertible sources behind. Dev-only, since it may run Blender.
[[bin]]
name = "export"
path = "src/bin/export.rs"
required-features = ["dev"]

# Long-lived headless EDIT-mode session + command channel (the keystone, #177).
# Dev-only: an agent drives the full `api::` surface over stdin against a live world.
[[bin]]
name = "session"
path = "src/bin/session.rs"
required-features = ["dev"]

# MCP stdio bridge: drive the edit-mode session over the Model Context Protocol,
# so Claude Code attaches to the engine natively (#288). Dev-only.
[[bin]]
name = "session-mcp"
path = "src/bin/session_mcp.rs"
required-features = ["dev"]

# Generate and play-test a test game from `games/<name>/` (#2029): `make game`.
[[bin]]
name = "game"
path = "src/bin/game.rs"
required-features = ["dev"]

# Headless editor capture (#731): the egui editor over a scene, offscreen, to a PNG —
# what an editor-visible PR attaches. Dev-only, and needs the editor.
[[bin]]
name = "editor-capture"
path = "src/bin/editor_capture.rs"
required-features = ["dev", "editor"]

# The whole integration suite. `tests/main.rs` declares every test file as a module;
# `tests/layout.rs` fails if a file is added without its `mod` line (docs/testing.md).
[[test]]
name = "integration"
path = "tests/main.rs"

[features]
default = ["editor"]
# The agentic dev layer: harness, scenario runner, console REPL, Debug.* Lua API.
dev = ["dep:rusty-dev", "rusty-dev/dev", "rusty-render/dev", "rusty-app/dev", "rusty-script/dev", "rusty-ai/dev", "rusty-navigation/dev", "rusty-physics/dev", "rusty-scene/dev", "rusty-shadergen/dev", "rusty-asset/dev", "rusty-core/dev", "dep:getrandom"]
# The egui editor (#431): `src/editor` and the shell's editor frontend. Default-on so
# `cargo run` opens the editor; a shipped player builds with `--no-default-features`.
editor = ["rusty-render/editor", "rusty-app/editor", "rusty-physics/editor", "rusty-shadergen/editor", "rusty-asset/editor", "rusty-core/editor", "dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:egui-phosphor", "dep:notify"]

# The workspace's lint policy lives here, not in command-line flags, so a plain
# `cargo clippy`, rust-analyzer and CI all read the same rules (#485); every member
# inherits it with `[lints] workspace = true`. The
# threshold is `too-many-lines-threshold` in clippy.toml. CI adds `-D warnings`;
# the sim modules' `#![deny(clippy::unwrap_used)]` stays module-scoped (#195), one per
# sim row of the layer table, held there by `make rules` (`unwrap-deny`, #962).
[workspace.lints.clippy]
too_many_lines = "deny"
# Exceptions are inline, with a written reason (#961): `#[expect(lint, reason = "…")]`,
# which also goes stale loudly once the lint stops firing. A module-root `#![allow]`
# (the determinism opt-outs) still needs its `reason`.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# The determinism ban (#757); the banned items and the reason live in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"
# Nothing temporary ships (#935): debug prints and unfinished stubs are issues, not code.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true

# Every external crate's version, features and why, in one place: a member names one
# with `{ workspace = true }` (adding `optional = true` where a feature turns it on).
[workspace.dependencies]
# The workspace's own crates, named the same way by the members that depend on them.
rusty-core = { path = "crates/core" }
rusty-time = { path = "crates/time" }
rusty-asset = { path = "crates/asset" }
rusty-procgen = { path = "crates/procgen" }
rusty-shadergen = { path = "crates/shadergen" }
rusty-components = { path = "crates/components" }
rusty-ecs = { path = "crates/ecs" }
rusty-scene = { path = "crates/scene" }
rusty-audio = { path = "crates/audio" }
rusty-ui = { path = "crates/ui" }
rusty-physics = { path = "crates/physics" }
rusty-navigation = { path = "crates/navigation" }
rusty-ai = { path = "crates/ai" }
rusty-render = { path = "crates/render" }
rusty-script = { path = "crates/script" }
rusty-logging = { path = "crates/logging" }
rusty-preview = { path = "crates/preview" }
rusty-app = { path = "crates/app" }
rusty-dev = { path = "crates/dev" }
rusty-test-support = { path = "crates/test-support" }

winit = { version = "0.30.13" }
wgpu = { version = "30.0.1", features = ["naga-ir"] }
# WGSL only (`shadergen`): its default `glsl` front end would build naga's GLSL parser for nothing.
naga_oil = { version = "0.23", default-features = false }
# The IR `naga_oil` composes into, named directly so GPU-free shader composition
# (`shadergen::compose`, #722) needs no `wgpu`. Same 30 that wgpu 30 links:
# wgpu, naga and naga_oil upgrade as a unit.
naga = { version = "30.0.1" }
egui = { version = "0.36.2" }
egui-wgpu = { version = "0.36.2" }
egui-winit = { version = "0.36.2", default-features = false, features = ["clipboard"] }
egui-phosphor = { version = "0.14.0" }
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
glam = { version = "0.33", features = ["bytemuck", "serde"] }
# MikkTSpace tangents (#756): the basis normal maps are baked in. Pure, no deps.
bevy_mikktspace = "1.0.0"
hecs = { version = "0.10.5" }
# The sim's hash maps (#764): FxHash has no per-process seed, so a map iterates in the
# same order every run. Already in the tree through mlua and type-map: same version.
rustc-hash = "2.1.2"
# Content fingerprints (#1326): xxh3 runs at opt-level 2 as a dependency, ~40x the
# opt-level-0 FNV the editor ran, and its output is fixed by its spec on every platform.
xxhash-rust = { version = "0.8.19", default-features = false, features = ["xxh3"] }
rapier3d = { version = "0.36.0" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tga"] }
ktx2 = { version = "0.3.0" }
# Texture compression at import (#1574): BC4/BC5/BC7 block encoders, and BC6H for
# baked lightmap pages (#1694; its `half` floats were already in the tree), pure Rust
# (a port of Intel's ISPC texture compressor). The CPU encoders only: its default
# features add a wgpu compute path, which would tie it to our wgpu version.
block_compression = { version = "0.11.0", default-features = false, features = ["bc15", "bc6h", "bc7"] }
tobj = { version = "4.0.2" }
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names", "KHR_materials_ior", "KHR_materials_specular"] }
# FBX import (#1024): the official bindings to ufbx (MIT/Unlicense), the library
# Godot and Bevy's FBX loader read FBX with. An `.fbx` is converted to a cached glTF
# at import (`asset::convert`), so nothing past the importer reads FBX.
ufbx = "0.11.5"
# Meshlets (#1968): meshoptimizer's official bindings (MIT/Apache-2.0) split a big mesh into
# clusters at import, each with its bounds and normal cone, which the GPU occlusion
# cull tests one by one. Built from C++ by `cc`, as ufbx is from C.
meshopt = "0.7.0"
bytemuck = { version = "1.16.1", features = ["derive"] }
# No default features: RUST_LOG filtering stays, colour and timestamps (anstream, jiff) go.
env_logger = { version = "0.11.3", default-features = false }
log = "0.4.22"
pollster = "0.4.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
# Font parsing, metrics and glyph outlines for UI `Text` (#419, #1328), and its shaping
# (ligatures, marks, kerning). Direct, not through egui: egui is editor-only (#431) and
# the player needs text. Both are already in the editor build through epaint: same
# versions and features.
skrifa = { version = "0.44.0", default-features = false, features = ["std", "autohint_shaping"] }
harfrust = "0.12.0"
# Gamepads (#471): buttons, sticks, triggers and rumble, polled once by the shell.
# Needs libudev on Linux (already in CI's apt list for winit).
gilrs = "0.11.2"
# The editor's watch on the project's files (#1327): a change made outside the engine
# (Blender, an image editor) is noted like an engine write, so every path-keyed cache
# reloads it. Editor-only: a shipped game never watches its files. Its default
# features are cut to the FSEvents backend on macOS; on Linux its inotify crate is
# already in the tree through gilrs (same version), and it adds mio for its loop.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
# The OS clipboard for `Input.GetClipboard` / `SetClipboard` (#612), read by the shell
# in both frontends: X11 and macOS. Already in the tree through egui-winit (same
# version), but the player build has no egui. egui-winit's `clipboard` feature also
# turns on its `image-data`.
arboard = { version = "3.6.1", default-features = false }
# The audio device and mixer (#465): kira's cpal backend, mixer tracks, filters,
# sends and tweened parameters. Caret on 0.x pins the minor: 0.13 is a deliberate bump.
# Its own decoding is off: clips decode through symphonia below, which keeps a clip's
# channel count (kira's loader drops it and rejects more than two channels).
kira = { version = "0.12.5", default-features = false, features = ["cpal"] }
# Clip decoding (#212, #545): `.ogg` Vorbis, `.wav` and `.mp3`. The version kira uses.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
# The synthesiser behind `Sound.*` (#413): scorsese's zimmer crate, pinned to a
# commit — never a branch — because `zimmer::SYNTH_VERSION` moves whenever a recipe
# would render differently, and rusty's bakes should change only when someone moves
# this pin on purpose. No I/O inside it: rusty writes the files and resolves patch
# references. Bump the rev in its own PR and record the new SYNTH_VERSION there.
zimmer = { package = "scorsese-zimmer", git = "https://github.com/MatthewLacerda2/scorsese", rev = "4bd8c840ef991cb124357bb60484fc40a74b8730" }
# The provider boundary (#383): scorsese's providers crate — the key resolver, the
# budget ceiling, dated price tables and the vendors' HTTP client (`ureq` + `rustls`)
# — behind `crates/dev/src/providers/`. Optional and enabled only by `dev`, so ship and
# player builds carry no HTTP client. Same rev as zimmer, which it depends on:
# move the two pins together, or the tree gains a second zimmer.
scorsese-providers = { git = "https://github.com/MatthewLacerda2/scorsese", rev = "4bd8c840ef991cb124357bb60484fc40a74b8730" }
# Its core crate, named directly for one function: `hash_bytes` (sha256 → hex), the
# hasher scorsese names its bakes and briefs with, so a generated asset's address
# (#384) is the same answer in both trees. Already in the lockfile through the line
# above; same rev, same `dev` gate. Nothing of its `Project` model is used.
scorsese-core = { git = "https://github.com/MatthewLacerda2/scorsese", rev = "4bd8c840ef991cb124357bb60484fc40a74b8730" }
# Open Image Denoise, opened at run time (#1884, `crates/dev/src/bake/denoise/`): the
# lightmap bake's trained denoiser is a native library a machine may lack, so it is
# `dlopen`ed, never linked, and a bake without it filters. Already in the tree
# through wgpu; same version. `dev` only: a shipped game never bakes.
libloading = { version = "0.8.9" }
# Named only to close a feature split (docs/testing.md, *Build and test share one
# dependency graph*): scorsese-providers' `zip` brings getrandom 0.4 into the `dev`
# build without `std`/`sys_rng`, which a test-only crate (`rand`) turns on, so
# `cargo test` would build its own copy of everything above it. Never `use`d.
getrandom = { version = "0.4.3", features = ["std", "sys_rng"] }
# The editor's Dock icon (#669): winit has no window icon on macOS, so it is set on
# `NSApplication`. The same versions arboard already brings into the tree.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
# The Wayland half of the clipboard (#612), on the window's own `wl_display`; also
# already in the tree through egui-winit. Pinned to 0.7.2: 0.7.3 only moves to SCTK 0.20,
# which duplicates winit 0.30's SCTK 0.19 stack (5 crates). Remove the pin when winit moves
# to SCTK 0.20; egui-winit requires `^0.7.2`.
smithay-clipboard = "=0.7.2"
# Property-based testing for the deterministic sim (#123): generators are seeded
# by proptest itself (no wall-clock), so the determinism guard is respected. `std` is for
# the regex strategies; no test uses fork, timeout or bit-set strategies.
proptest = { version = "1", default-features = false, features = ["std"] }

[dependencies]
# The moved modules (crates/), re-exported in src/lib.rs under their old names.
rusty-dev = { workspace = true, optional = true }
rusty-logging = { workspace = true }
rusty-preview = { workspace = true }
rusty-render = { workspace = true }
rusty-app = { workspace = true }
rusty-script = { workspace = true }
rusty-ai = { workspace = true }
rusty-navigation = { workspace = true }
rusty-physics = { workspace = true }
rusty-ui = { workspace = true }
rusty-audio = { workspace = true }
rusty-scene = { workspace = true }
rusty-ecs = { workspace = true }
rusty-components = { workspace = true }
rusty-shadergen = { workspace = true }
rusty-procgen = { workspace = true }
rusty-asset = { workspace = true }
rusty-core = { workspace = true }
rusty-time = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
egui-winit = { workspace = true, optional = true }
egui-phosphor = { workspace = true, optional = true }
mlua = { workspace = true }
glam = { workspace = true }
rustc-hash = { workspace = true }
xxhash-rust = { workspace = true }
image = { workspace = true }
ktx2 = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skrifa = { workspace = true }
gilrs = { workspace = true }
notify = { workspace = true, optional = true }
arboard = { workspace = true }
# A feature pin, never `use`d: why is beside its version above.
getrandom = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard = { workspace = true }

[dev-dependencies]
# The in-crate tests' shared helpers (`crate::test_temp`), a crate of their own so
# every member's tests reach them (crates/test-support).
rusty-test-support = { workspace = true }
proptest = { workspace = true }

# Dev builds (#487); `cargo test` inherits this profile, and so do CI, coverage and
# mutants. rusty's own crate stays at opt-level 0 so an edit rebuilds in seconds, and
# keeps only line tables so a backtrace still names file:line. Dependencies (rapier,
# wgpu/naga, image, the vendored Lua VM) are optimised and carry no debuginfo: tests
# and debug runs execute them at near-release speed, and `target/` loses the debuginfo
# that was most of its size and link time. The price is a slower cold build of the
# dependencies, paid once per fresh `target/`. PR #523 has the measurements.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# rusty splits into ~1600 codegen units (roughly two per module). At the default
# cap of 256, rustc merges them by size, so an edit that changes one function's size
# reshuffles the merge and recompiles 4-99 units instead of 2. A cap above the
# natural count keeps each module in its own unit. docs/testing.md has the numbers (#574).
[profile.dev.package.rusty]
codegen-units = 4096
