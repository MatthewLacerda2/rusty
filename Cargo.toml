[package]
name = "rusty"
version = "0.1.0"
edition = "2021"
# This is the engine application itself, not a library we publish to crates.io.
# `publish = false` also lets the cargo-deny license gate skip our own crate
# (via `[licenses] private.ignore`) while still gating every dependency.
publish = false

[lib]
name = "rusty"
path = "src/lib.rs"

[[bin]]
name = "rusty"
path = "src/main.rs"

# Headless deterministic runner (the agent's hands). Dev-only: stripped from ship
# builds. Build/run with `--features dev`.
[[bin]]
name = "play"
path = "src/bin/play.rs"
required-features = ["dev"]

# Long-lived headless EDIT-mode session + command channel (the keystone, #177).
# Dev-only: an agent drives the full `api::` surface over stdin against a live world.
[[bin]]
name = "session"
path = "src/bin/session.rs"
required-features = ["dev"]

[features]
# The agentic dev layer: harness, scenario runner, console REPL, Debug.* Lua API.
dev = []

[dependencies]
winit = { version = "0.29.10" }
wgpu = { version = "0.19.4", features = ["naga-ir"] }
naga_oil = { version = "0.13" }
egui = { version = "0.27.2" }
egui-wgpu = { version = "0.27.2" }
egui-winit = { version = "0.27.2", default-features = false, features = ["clipboard", "links"] }
egui-phosphor = { version = "0.5.0" }
mlua = { version = "0.9.2", features = ["lua54", "vendored"] }
glam = { version = "0.25.0", features = ["bytemuck", "serde"] }
hecs = { version = "0.10.5" }
rapier3d = { version = "0.19.0" }
image = { version = "0.24.9", default-features = false, features = ["png", "tga"] }
tobj = { version = "4.0.2" }
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
bytemuck = { version = "1.16.1", features = ["derive"] }
env_logger = "0.11.3"
log = "0.4.22"
pollster = "0.4.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"

[dev-dependencies]
# Property-based testing for the deterministic sim (#123): generators are seeded
# by proptest itself (no wall-clock), so the determinism guard is respected.
proptest = "1"
