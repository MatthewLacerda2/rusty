[package]
name = "rusty"
version = "0.1.0"
edition = "2021"
# This is the engine application itself, not a library we publish to crates.io.
# `publish = false` also lets the cargo-deny license gate skip our own crate
# (via `[licenses] private.ignore`) while still gating every dependency.
publish = false
# Integration tests build as ONE binary, not one per `tests/*.rs` (#483): each of those
# linked the whole engine (wgpu, egui, rapier, Lua). See the `[[test]]` target below.
autotests = false

[lib]
name = "rusty"
path = "src/lib.rs"

# The editor. Needs the `editor` feature (on by default).
[[bin]]
name = "rusty"
path = "src/main.rs"
required-features = ["editor"]

# The standalone player (#431): boots the project's startup scene straight into Play
# with no editor. What a game ships as — build it with `--no-default-features` so the
# editor (egui) is stripped, the same way `dev` strips the harness.
[[bin]]
name = "player"
path = "src/bin/player.rs"

# Headless deterministic runner (the agent's hands). Dev-only: stripped from ship
# builds. Build/run with `--features dev`.
[[bin]]
name = "play"
path = "src/bin/play.rs"
required-features = ["dev"]

# Long-lived headless EDIT-mode session + command channel (the keystone, #177).
# Dev-only: an agent drives the full `api::` surface over stdin against a live world.
[[bin]]
name = "session"
path = "src/bin/session.rs"
required-features = ["dev"]

# MCP stdio bridge: drive the edit-mode session over the Model Context Protocol,
# so Claude Code attaches to the engine natively (#288). Dev-only.
[[bin]]
name = "session-mcp"
path = "src/bin/session_mcp.rs"
required-features = ["dev"]

# Headless editor capture (#731): the egui editor over a scene, offscreen, to a PNG —
# what an editor-visible PR attaches. Dev-only, and needs the editor.
[[bin]]
name = "editor-capture"
path = "src/bin/editor_capture.rs"
required-features = ["dev", "editor"]

# The whole integration suite. `tests/main.rs` declares every test file as a module;
# `tests/layout.rs` fails if a file is added without its `mod` line (docs/testing.md).
[[test]]
name = "integration"
path = "tests/main.rs"

[features]
default = ["editor"]
# The agentic dev layer: harness, scenario runner, console REPL, Debug.* Lua API.
dev = []
# The egui editor (#431): `src/editor` and the shell's editor frontend. Default-on so
# `cargo run` opens the editor; a shipped player builds with `--no-default-features`.
editor = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:egui-phosphor"]

# The crate's lint policy lives here, not in command-line flags, so a plain
# `cargo clippy`, rust-analyzer and CI all read the same rules (#485). The
# threshold is `too-many-lines-threshold` in clippy.toml. CI adds `-D warnings`;
# the sim modules' `#![deny(clippy::unwrap_used)]` stays module-scoped (#195).
[lints.clippy]
too_many_lines = "deny"
# The determinism ban (#757); the banned items and the reason live in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"

[dependencies]
winit = { version = "0.30.13" }
wgpu = { version = "30.0.1", features = ["naga-ir"] }
naga_oil = { version = "0.23" }
# The IR `naga_oil` composes into, named directly so GPU-free shader composition
# (`shadergen::compose`, #722) needs no `wgpu`. Same 30 that wgpu 30 links:
# wgpu, naga and naga_oil upgrade as a unit.
naga = { version = "30.0.1" }
egui = { version = "0.36.2", optional = true }
egui-wgpu = { version = "0.36.2", optional = true }
egui-winit = { version = "0.36.2", default-features = false, features = ["clipboard"], optional = true }
egui-phosphor = { version = "0.14.0", optional = true }
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
glam = { version = "0.33", features = ["bytemuck", "serde"] }
# MikkTSpace tangents (#756): the basis normal maps are baked in. Pure, no deps.
bevy_mikktspace = "1.0.0"
hecs = { version = "0.10.5" }
# The sim's hash maps (#764): FxHash has no per-process seed, so a map iterates in the
# same order every run. Already in the tree through rapier and wgpu: same version.
rustc-hash = "2.1.2"
rapier3d = { version = "0.36.0" }
image = { version = "0.25.10", default-features = false, features = ["png", "tga"] }
ktx2 = { version = "0.3.0" }
tobj = { version = "4.0.2" }
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
bytemuck = { version = "1.16.1", features = ["derive"] }
env_logger = "0.11.3"
log = "0.4.22"
pollster = "0.4.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
# Font parsing, metrics and glyph outlines for UI `Text` (#419). Direct, not through
# egui: egui is editor-only (#431) and the player needs text. Same version egui pulls.
ab_glyph = "0.2.32"
# Its OpenType parser, read directly for GPOS pair kerning (ab_glyph reads only the
# legacy `kern` table). Already in the tree through ab_glyph: same version.
ttf-parser = "0.25.1"
# Gamepads (#471): buttons, sticks, triggers and rumble, polled once by the shell.
# Needs libudev on Linux (already in CI's apt list for winit).
gilrs = "0.11.2"
# The OS clipboard for `Input.GetClipboard` / `SetClipboard` (#612), read by the shell
# in both frontends: X11 and macOS. Already in the tree through egui-winit (same
# version, same no-image features), but the player build has no egui.
arboard = { version = "3.6.1", default-features = false }
# The audio device and mixer (#465): kira's cpal backend, mixer tracks, filters,
# sends and tweened parameters. Caret on 0.x pins the minor: 0.13 is a deliberate bump.
# Its own decoding is off: clips decode through symphonia below, which keeps a clip's
# channel count (kira's loader drops it and rejects more than two channels).
kira = { version = "0.12.5", default-features = false, features = ["cpal"] }
# Clip decoding (#212, #545): `.ogg` Vorbis, `.wav` and `.mp3`. The version kira uses.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
# Not used by rusty's code (#552). proptest turns on getrandom's `std` feature (via
# rand_core), so without this line `cargo build` and `cargo test` resolve getrandom
# differently. That split rebuilt ahash, hashbrown, hecs, the wgpu and egui stacks
# and rusty itself once more for tests. Enabling `std` here makes both builds
# resolve the same features. Keep the major version in step with Cargo.lock.
getrandom = { version = "0.3", features = ["std"] }
# The synthesiser behind `Sound.*` (#413): scorsese's zimmer crate, pinned to a
# commit — never a branch — because `zimmer::SYNTH_VERSION` moves whenever a recipe
# would render differently, and rusty's bakes should change only when someone moves
# this pin on purpose. No I/O inside it: rusty writes the files and resolves patch
# references. Bump the rev in its own PR and record the new SYNTH_VERSION there.
zimmer = { package = "scorsese-zimmer", git = "https://github.com/MatthewLacerda2/scorsese", rev = "342523ca32baf69d7423f8942953bb26d0a4b246" }

[target.'cfg(target_os = "macos")'.dependencies]
# The editor's Dock icon (#669): winit has no window icon on macOS, so it is set on
# `NSApplication`. The same versions arboard already brings into the tree.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The Wayland half of the clipboard (#612), on the window's own `wl_display`; also
# already in the tree through egui-winit.
smithay-clipboard = "0.7.3"

[dev-dependencies]
# Property-based testing for the deterministic sim (#123): generators are seeded
# by proptest itself (no wall-clock), so the determinism guard is respected.
proptest = "1"

# Dev builds (#487); `cargo test` inherits this profile, and so do CI, coverage and
# mutants. rusty's own crate stays at opt-level 0 so an edit rebuilds in seconds, and
# keeps only line tables so a backtrace still names file:line. Dependencies (rapier,
# wgpu/naga, image, the vendored Lua VM) are optimised and carry no debuginfo: tests
# and debug runs execute them at near-release speed, and `target/` loses the debuginfo
# that was most of its size and link time. The price is a slower cold build of the
# dependencies, paid once per fresh `target/`. PR #523 has the measurements.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# rusty splits into ~1600 codegen units (roughly two per module). At the default
# cap of 256, rustc merges them by size, so an edit that changes one function's size
# reshuffles the merge and recompiles 4-99 units instead of 2. A cap above the
# natural count keeps each module in its own unit. docs/testing.md has the numbers (#574).
[profile.dev.package.rusty]
codegen-units = 4096
