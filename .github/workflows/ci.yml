name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # GitHub fires `merge_group` when a PR is queued via the merge queue; CI must
  # run on it so the required checks validate the speculative merged state before
  # it lands. The gating jobs below opt in via their `if`; the report-only
  # coverage/mutants jobs deliberately do not, to keep the queue lean.
  merge_group:
  # `coverage` runs here — post-merge on `main`, never on `pull_request`: it takes
  # ~15 min and, being non-blocking, only ever sat on a PR as a phantom "still
  # running" long after the gating checks were green, which read as a stuck PR. On
  # `main` it still produces the ratchet/baseline data without stalling any PR or
  # the queue. Mutation testing is split differently (see the two `mutants*` jobs):
  # a fast, diff-scoped, informational run *does* run per-PR so the coding agent
  # gets a fresh-context catch, while the full-sim sweep moved to the nightly
  # `schedule` below — the report-only backstop.
  push:
    branches: [main]
  # Nightly full-sim mutation sweep (the `mutants` job): re-examines untouched code
  # the per-PR diff run never mutates and tracks/ratchets the survivor backlog.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # Detect whether the PR changes anything other than Markdown. On a Markdown-only
  # PR the heavy Rust *steps* below are skipped, but the required job still RUNS and
  # reports `success` (a job whose steps all skip still succeeds). This is on
  # purpose: the branch ruleset treats a *skipped* required check as
  # "Expected"/unsatisfied — NOT a pass — so skipping the whole job would wedge a
  # docs-only PR as unmergeable (issue #218). So we keep the cheap-docs-PR path by
  # guarding the required job's steps on `code`, never by skipping the job itself.
  # See the merging note in CLAUDE.md.
  #
  # `sim` narrows further: it's true only when the PR touches code that can change
  # mutation-test outcomes on the four deterministic sim modules — their source, the
  # integration tests that exercise them, or the dependency/toolchain pins. The slow
  # `mutants` sweep is gated on it so a docs/CI/tooling/non-sim-src PR no longer pays
  # for a full ~15-min mutation run that could not have changed anything it measures.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
      sim: ${{ steps.filter.outputs.sim || 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        # Runs on PRs (diff vs. base) and on push to main (diff of the merge
        # commit) so the post-merge coverage/mutants jobs can skip docs-only or
        # non-sim merges just as they did per-PR.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            code:
              - '!**/*.md'
            sim:
              - 'src/app/**'
              - 'src/scripting/**'
              - 'src/physics/**'
              - 'src/navigation/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'

  # The Linux build+test. Kept as its own job (not folded into the OS matrix
  # below) so the `build-test` status-check name — referenced by the branch
  # ruleset as a required check — is preserved exactly. The job ALWAYS runs on a
  # non-draft PR / merge_group so the required check reports `success` (never
  # `skipped`); the build/test steps are guarded on `code`, so a Markdown-only PR
  # is a fast no-op success (issue #218).
  build-test:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'
      - name: Toolchain (from rust-toolchain.toml)
        if: needs.changes.outputs.code != 'false'
        run: rustup show
      - name: Cache cargo registry + target
        if: needs.changes.outputs.code != 'false'
        uses: Swatinem/rust-cache@v2
      - name: System libs for winit/wgpu builds
        if: needs.changes.outputs.code != 'false'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Build (default)
        if: needs.changes.outputs.code != 'false'
        run: cargo build --locked
      - name: Build (dev features)
        if: needs.changes.outputs.code != 'false'
        run: cargo build --features dev --locked
      - name: Test (engine, default)
        if: needs.changes.outputs.code != 'false'
        run: cargo test --locked
      - name: Test (engine, dev features)
        if: needs.changes.outputs.code != 'false'
        run: cargo test --features dev --locked
      - name: Test (lint xtask)
        if: needs.changes.outputs.code != 'false'
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked

  # Verify the wgpu cross-platform claim (issue #121): the same build + test on
  # macOS (Metal) and Windows (D3D12), so the portability premise is checked, not
  # assumed. Separate from `build-test` to avoid renaming that required check.
  # `fail-fast: false` so one OS's failure doesn't cancel the other's result.
  build-test-cross:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event.pull_request.draft == false && needs.changes.outputs.code != 'false')
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      # macOS/Windows use their native backends and need no extra system libs; the
      # apt step is Linux-only and lives on the `build-test` job above.
      - name: Build (default)
        run: cargo build --locked
      - name: Build (dev features)
        run: cargo build --features dev --locked
      - name: Test (engine, default)
        run: cargo test --locked
      - name: Test (engine, dev features)
        run: cargo test --features dev --locked
      - name: Test (lint xtask)
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked

  # Per-PR coverage signal — diff-scoped, informational (the coverage analog of
  # mutants-pr, #194/#157). Unlike mutation, cargo-llvm-cov can't cheaply scope the
  # *measurement* to a diff — the instrumented suite still runs in full — but the
  # *report* is scoped to the lines this PR changed via `diff-cover`, so the agent
  # sees exactly whether its new sim code is tested (the fresh-context catch).
  # Non-blocking and not a required check, so it never gates a merge and may even
  # finish after one without stalling anything. Gated by the cheap `sim` filter.
  coverage-pr:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.sim != 'false'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so diff-cover can diff the changed lines against the base.
          fetch-depth: 0
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Add llvm-tools-preview (required by cargo-llvm-cov)
        run: rustup component add llvm-tools-preview
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Install diff-cover
        run: pipx install diff-cover
      - name: Measure coverage (both feature sets, accumulated)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --locked
          cargo llvm-cov --no-report --features dev --locked
      - name: Cobertura report (sim modules only)
        # Same ignore-regex as the main job: restrict to app/scripting/physics/
        # navigation so diff-cover only ever scores changed *sim* lines. The
        # `src/[^/]+\.rs` term drops every top-level src file (main/lib/settings/…)
        # — none are sim, all sim code lives in subdirectories — so a new top-level
        # file can't silently pollute the number (the #163 class of bug).
        run: |
          cargo llvm-cov report --cobertura --output-path cobertura-sim.xml \
            --ignore-filename-regex 'src/(render|dev|api|asset|editor|components|core|ecs|scene|time)/|src/[^/]+\.rs|src/bin/|tools/'
      - name: Diff coverage of changed sim lines
        id: diffcov
        # --fail-under 100 makes diff-cover exit non-zero when any changed sim line
        # is uncovered; we capture that as the "gaps" signal, not as a build failure.
        run: |
          BASE='origin/${{ github.event.pull_request.base.ref }}'
          if diff-cover cobertura-sim.xml --compare-branch "$BASE" \
               --markdown-report coverage-diff.md --fail-under 100; then
            echo 'has_gaps=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_gaps=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize diff coverage (job summary + comment body)
        if: always()
        run: |
          {
            echo '### Diff coverage — changed sim lines (informational, non-blocking)'
            echo ''
            cat coverage-diff.md 2>/dev/null || echo 'No coverage information for the changed lines.'
          } | tee comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post diff-coverage comment
        if: always() && steps.diffcov.outputs.has_gaps == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-diff
          path: comment.md
      - name: Clear stale diff-coverage comment
        # Idempotent: once a re-push covers the changed lines, drop the comment.
        if: always() && steps.diffcov.outputs.has_gaps != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-diff
          delete: true

  coverage:
    needs: changes
    runs-on: ubuntu-latest
    # Post-merge on main (or manual), not per-PR — see the `push` trigger note; the
    # per-PR fresh-context signal is the diff-scoped `coverage-pr` job above.
    # Skips docs-only merges via the `code` filter.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.code != 'false')
    # Informational signal, never a merge blocker (CLAUDE.md gates-vs-signals).
    # On `main` it ratchets the deterministic sim modules (app/scripting/physics/
    # navigation) against the committed floors in `coverage-baseline.txt`: a drop
    # below a floor is surfaced here but does not fail the build. The platform layer
    # (main.rs, render, dev) is exempt — see docs/testing.md. `continue-on-error`
    # keeps even a regression non-blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Add llvm-tools-preview (required by cargo-llvm-cov)
        run: rustup component add llvm-tools-preview
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage (both feature sets, accumulated)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --locked
          cargo llvm-cov --no-report --features dev --locked
      - name: Whole-crate summary
        run: |
          {
            echo '### Coverage summary (whole crate)'
            echo ''
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ratchet sim coverage against the committed baseline
        # Per-module line coverage vs the floors in coverage-baseline.txt. The
        # `regex` crate llvm-cov uses has no look-around, so each module is isolated
        # by ignoring the other three plus all non-sim paths; `src/[^/]+\.rs` drops
        # every top-level src file (main/lib/settings/…) so none can pollute the
        # number (the #163 class of bug). Informational: a drop below a floor is
        # flagged but the step never exits non-zero (and the job is continue-on-error
        # regardless), honouring "inform on quality, never block".
        run: |
          NONSIM='render|dev|api|asset|editor|components|core|ecs|scene|time'
          {
            echo '### Sim-module coverage ratchet (informational, non-blocking)'
            echo ''
            echo '| Module | Floor | Current | Status |'
            echo '|---|---|---|---|'
            regressed=0
            while read -r module floor; do
              case "$module" in ''|\#*) continue ;; esac
              others=$(echo "app scripting physics navigation" \
                | tr ' ' '\n' | grep -v "^${module}$" | paste -sd'|')
              cur=$(cargo llvm-cov report --json --summary-only \
                --ignore-filename-regex "src/(${others}|${NONSIM})/|src/[^/]+\.rs|src/bin/|tools/" \
                | jq '.data[0].totals.lines.percent')
              status='✅'
              if awk "BEGIN{exit !(${cur} < ${floor})}"; then status='❌ regression'; regressed=1; fi
              printf '| %s | %.2f | %.2f | %s |\n' "$module" "$floor" "$cur" "$status"
            done < coverage-baseline.txt
            echo ''
            if [ "$regressed" = 1 ]; then
              echo '> A sim module dropped below its committed floor. Informational — add'
              echo '> tests, or, if the drop is intended, lower it in `coverage-baseline.txt`.'
            else
              echo '> All sim modules at or above their committed floor.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deny:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event.pull_request.draft == false && needs.changes.outputs.code != 'false')
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Blocking supply-chain gate (no continue-on-error): a new RUSTSEC
          # advisory on any transitive dep fails the build, and licenses must be
          # on the explicit allow-list in deny.toml. v2 ships a newer cargo-deny
          # whose parser supports CVSS 4.0 advisories (v1 errors on those).
          # `bans`/`sources` stay as-is (warn). Policy lives in deny.toml.
          command: check advisories bans sources licenses

  # Per-PR mutation run — fast, diff-scoped, informational. Mutates only the lines
  # this PR changed within the deterministic sim modules (--in-diff ∩ --file), so
  # the cost scales with the change, not the whole codebase. Survivors are surfaced
  # in the PR's own context — a job-summary block plus a sticky PR comment — so the
  # coding agent fixes them in-PR; that routing is what makes "informational" bite
  # without a hard gate. `continue-on-error` keeps it from ever blocking a merge,
  # and the cheap `sim` paths-filter short-circuits PRs that touch no sim code.
  mutants-pr:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.sim != 'false'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can diff against the PR base to build the --in-diff patch.
          fetch-depth: 0
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Build the PR diff (changed lines vs. merge-base)
        run: git diff ${{ github.event.pull_request.base.sha }}...HEAD > pr.diff
      - name: Mutation test (changed sim lines only, informational)
        # --in-diff restricts mutants to the lines this PR changed; the --file sim
        # globs keep it from mutating anything outside the deterministic sim even
        # if the diff strays. Same dev-feature build + timeout guard as the sweep.
        run: |
          cargo mutants --no-shuffle --timeout-multiplier 3 --in-diff pr.diff \
            --file 'src/app/**/*.rs' \
            --file 'src/scripting/**/*.rs' \
            --file 'src/physics/**/*.rs' \
            --file 'src/navigation/**/*.rs' \
            -- --features dev
      - name: Summarize survivors (job summary + comment body)
        id: prep
        if: always()
        # cargo-mutants exits non-zero when mutants survive, so this and the steps
        # below run with `if: always()`. Build the same block for the run summary
        # and the sticky comment; flag whether there were any survivors.
        run: |
          MISSED=mutants.out/missed.txt
          {
            echo '### Mutation testing — diff-scoped (informational, non-blocking)'
            echo ''
            if [ -s "$MISSED" ]; then
              echo 'These **changed** sim lines were mutated and no test caught it. Strengthen the tests covering them:'
              echo ''
              echo '```'
              cat "$MISSED"
              echo '```'
            else
              echo 'No surviving mutants in the changed sim lines. ✅'
            fi
          } | tee comment.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$MISSED" ]; then
            echo 'has_survivors=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_survivors=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Post surviving-mutant comment
        if: always() && steps.prep.outputs.has_survivors == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mutants-diff
          path: comment.md
      - name: Clear stale survivor comment
        # Idempotent: when a re-push fixes the survivors, drop the old comment so the
        # PR doesn't carry a stale list.
        if: always() && steps.prep.outputs.has_survivors != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mutants-diff
          delete: true
      - name: Upload surviving-mutant report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-pr-report
          path: mutants.out/

  # Nightly full-sim mutation sweep — the report-only backstop. Unlike the per-PR
  # diff run, this re-mutates the *entire* deterministic sim (app/scripting/physics/
  # navigation), re-examining untouched code the diff run never touches and
  # tracking/ratcheting the survivor backlog (#158–#161). Runs on the nightly
  # `schedule` or on demand; never on a PR, never blocking. No `needs: changes`:
  # there is no PR/push diff to filter on a scheduled/manual run, so it always
  # sweeps the full set.
  mutants:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutation test (full deterministic sim, report-only)
        # Build/test with the dev feature so the headless-harness sim tests run
        # too. Scoped by --file to the sim modules; the timeout multiplier guards
        # against mutants that induce infinite loops.
        run: |
          cargo mutants --no-shuffle --timeout-multiplier 3 \
            --file 'src/app/**/*.rs' \
            --file 'src/scripting/**/*.rs' \
            --file 'src/physics/**/*.rs' \
            --file 'src/navigation/**/*.rs' \
            -- --features dev
      - name: Upload surviving-mutant report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
