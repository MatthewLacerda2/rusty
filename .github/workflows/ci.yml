name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Gates only (#750). Mutation and coverage are signals and have their own
  # workflows, off pull requests and off every merge: `coverage.yml` runs
  # weekly, and `mutants-on-request.yml` mutates exactly what someone names
  # (`make mutants-remote SCOPE=...`), never on a schedule. A signal that ran here held
  # runners the merge queue was waiting on, for a report that could not change
  # whether anything merged.
  push:
    branches: [main]
  # Which gating jobs also run on the schedule is a decision, not a side effect
  # (#480). Every one does now. `deny`: advisories land against code that has
  # not changed, so a nightly check is how a new RUSTSEC reaches us between
  # merges (RUSTSEC-2026-0257 was spotted that way). The build jobs since #1784:
  # a push whose tree its PR run proved no longer builds, so the nightly is what
  # rebuilds `main` against what moves with nothing in any diff (the runner
  # image and the lavapipe driver under it, #769/#930; macOS's Metal; a
  # `rust-cache` release) and re-saves `main`'s caches. One run a night instead
  # of one per merge; `ci-gate` goes red with any of them. Off the hour, where
  # GitHub's scheduler is least backed up.
  schedule:
    - cron: '7 3 * * *'
  # A proof run of a branch: the gates, nothing else.
  workflow_dispatch:

# Cancel superseded runs (#482), and only those (#930): a new push to a ready PR
# makes its previous run stale, so that run is cancelled instead of finishing
# beside the new one. Only a *ready* PR's runs share a group; a draft's runs
# (whose gating jobs skip anyway) and every other event (push to `main`, the
# nightly schedule, manual) are keyed on their own run id, so each of those
# finishes — a shared group would still let a newer run replace a *pending*
# one, even with cancel-in-progress off. Only a push (`synchronize`) cancels:
# `ready_for_review` and `reopened` carry the same commit as the run they would
# meet, so cancelling it would throw away a run of the head. `mergeable`'s
# `superseded` (#515, #562) still tells the two apart, as a safety net.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

# A gate proves this commit, so its proptests run on a fixed seed: a red one was
# caused by what is under test, not by a seed finding something old on an unrelated
# branch (#1777, #1798). The nightly explores instead: empty is proptest's random
# seed, and a finding there goes through `main-health` to the board, whose run link
# holds its `cc` line. `docs/testing.md` says how to reproduce one. `make test`
# reads the number from this line (the Makefile's PROPTEST_SEED, #1852), so it is
# the one place the seed is written.
env:
  PROPTEST_RNG_SEED: ${{ github.event_name != 'schedule' && '1784' || '' }}

jobs:
  # Detect whether the PR changes anything other than Markdown. On a Markdown-only
  # PR the heavy Rust *steps* below are skipped, but the required job still RUNS and
  # reports `success` (a job whose steps all skip still succeeds). This is on
  # purpose: the branch ruleset treats a *skipped* required check as
  # "Expected"/unsatisfied — NOT a pass — so skipping the whole job would wedge a
  # docs-only PR as unmergeable (issue #218). So we keep the cheap-docs-PR path by
  # guarding the required job's steps on `code`, never by skipping the job itself.
  # See the merging note in CLAUDE.md.
  #
  # `code` answers "must this run build?", so it is also 'false' on a push to
  # `main` whose tree a recent successful run already built (#1784): the squash
  # of an up-to-date head has the head's tree, which its PR run just proved.
  # `proved_tree.py` checks that mechanically, keeps the full run when the push
  # moves a cache key (Cargo.toml/lock, the toolchain, `.cargo/`,
  # `.github/actions/`, this file) or changes the decider (the script and what it
  # imports), and fails toward running on any error. A ready PR's run asks too
  # (#2333): its test merge's tree, built green by a dispatch or push run (a head
  # holding `main` that a coder proved before readying), skips the same way,
  # under the same full-run rules; a PR that changes the decider or either
  # gating workflow never asks (the `decider` filter). Skipped, the run's gating jobs report
  # `skipped`/`success` exactly as on a Markdown-only merge, so `ci-gate` passes.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read        # the earlier runs and their jobs (proved_tree.py)
      pull-requests: read  # paths-filter reads a PR's changed files
    outputs:
      code: ${{ steps.proved.outputs.proved == 'true' && 'false' || steps.filter.outputs.code || 'true' }}
      # Whether the change can break the fuzz target's build (`fuzz-check`); empty
      # off a PR or push, where that job runs regardless.
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      # On `pull_request` paths-filter reads the changed files from the API and
      # needs no clone; on `push` it diffs `github.event.before..HEAD` in a local
      # repo, so without this checkout it dies with git exit 128 — which failed
      # every post-merge run (#480).
      # paths-filter fetches `before` itself if the shallow clone lacks it.
      # A ready PR checks out for `proved_tree.py` alone (#2333).
      - uses: actions/checkout@v7
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
      - uses: dorny/paths-filter@v4
        id: filter
        # Runs on PRs (diff vs. base) and on push to main (diff of the merge
        # commit), so a docs-only merge skips the build steps just as a
        # docs-only PR does.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            code:
              - '!**/*.md'
              # The API-doc drift tests parse it: an edit to it alone is code (#525),
              # one file per namespace since #569.
              - 'docs/api/**'
              # Read by code and its tests: the game guide session-mcp serves and
              # the game CLAUDE.md template a project's edit-open embeds (#1313).
              - 'docs/game-agent.md'
              - 'crates/core/src/project/game_claude.md'
            # What decides a skip (#2333): a PR that changes it never asks
            # `proved_tree.py`, since the step would run the PR's own copy.
            decider:
              - '.github/scripts/proved_tree.py'
              - '.github/scripts/ghrest.py'
              - '.github/scripts/merging/__init__.py'
              - '.github/scripts/merging/verdict/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/lint.yml'
            # What can stop `fuzz/` compiling (`fuzz-check`): the target and its
            # manifest; the root package's manifest and re-exports (`src/lib.rs`),
            # which it imports through; every member's manifest (a feature or
            # dependency change) and crate root (a renamed re-export); the two crates whose API it calls
            # (`edit::apply_scene_data`, `scene::{Scene, SceneData}`), since a
            # signature lives in their modules, not their roots; the toolchain and
            # cargo config every build reads; and this file. Not the root
            # `Cargo.lock`, which the check derives its lock from: a bump that
            # breaks the fuzz target's build breaks the engine's too, and the
            # nightly's unconditional run bounds the rest. `make gates` reads this list too (`fuzz_gate.py`), so keep it
            # a flat list of quoted globs.
            fuzz:
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'src/lib.rs'
              - 'crates/*/Cargo.toml'
              - 'crates/*/src/lib.rs'
              - 'crates/edit/src/**'
              - 'crates/scene/src/**'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
      # A push and a ready PR ask (#2333), and only when they change code: a
      # Markdown-only change already skips. On a PR `github.sha` is the test
      # merge, whose tree a dispatch run on a head holding `main` built. A change
      # to a cache key's inputs (`Cargo.lock`, the toolchain, `.github/actions/`,
      # which pins the CI tools, #1973), this file or the script runs in full;
      # so does a PR's `decider` change, held here because the PR would run its
      # own copy (a push runs `main`'s, whose key check already holds `DECIDER`).
      # A draft and the nightly never ask; a dispatch always builds. A lookup that
      # breaks (no `gh`, a hung call) must not fail `changes` and turn `main`
      # red: the step may fail or time out, and its empty output means a full run.
      - name: Was this tree already proved?
        id: proved
        if: (github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)) && steps.filter.outputs.code != 'false' && (github.event_name != 'pull_request' || steps.filter.outputs.decider != 'true')
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/proved_tree.py --workflow ci.yml
          --event "${{ github.event_name }}" --sha "${{ github.sha }}" --before "${{ github.event.before }}"

  # The Linux build+test. Kept as its own job (not folded into the OS matrix
  # below) so the `build-test` name `mergeable.py` and `ci-gate`'s `needs:` read
  # is preserved (the ruleset requires `ci-gate`, not this job). The job
  # ALWAYS runs on a non-draft PR so it reports `success` (never `skipped`); the
  # build/test steps are guarded on `code`, so a Markdown-only PR is a fast no-op
  # success (issue #218).
  #
  # Three parallel jobs, not one (#2264): the default suite, and the `dev` suite
  # split in two by nextest's `--partition`. Run one after the other they took
  # 23.5 minutes on a fast runner and passed 30 on a slow one (the same tests run
  # about 30 % slower from runner to runner), so a green suite was cancelled
  # before its doctests. Each entry reports as `build-test (<features>, <shard>)`,
  # which the scripts read by its base name `build-test`; `ci-gate` waits on all
  # three, so any one failing or cancelled turns it red. A shard is a whole job,
  # not a step, so the timeout below bounds each one. The doctests run once per
  # feature set, on its first shard, and the lint xtask once, beside the default
  # suite. The matrix holds only what names a job: every key would show in it.
  #
  # The events each gating job runs on are listed explicitly (#480). A bare
  # `github.event.pull_request.draft == false` also matches `push` and `schedule`
  # — there is no PR, and GitHub's loose equality makes null == false — so the
  # old condition ran these jobs on events nobody had chosen. `push` is kept on
  # purpose: it builds the commit that actually landed on `main`, unless a run
  # already built that very tree (`changes`, #1784).
  build-test:
    needs: changes
    permissions:
      contents: read
      actions: read  # main's runs and their JUnit artifacts (slowest-tests)
    strategy:
      # One shard failing must not cancel the others: each one's verdict is
      # what tells a real red from a cancelled run.
      fail-fast: false
      matrix:
        include:
          - { features: default, shard: 1/1 }
          - { features: dev, shard: 1/2 }
          - { features: dev, shard: 2/2 }
    # A guard against a hang, not a budget a shard must fit: the slowest shares
    # are the two `dev` shards, which run the gpu group (355 s and 562 s of nextest
    # in run 44351591966); the default entry, which leaves that group to them, 73 s.
    timeout-minutes: 30
    # The one Ubuntu image: every Ubuntu job in `.github/workflows/`, and every
    # cache key that names an image, names this one (`test_runner_image.py` in
    # `.github/scripts/tests/`), so the mutation,
    # coverage and health runs test on the lavapipe the gate proves. A move is
    # one PR changing every one of them, which that check lists. Read #2385 before
    # moving it: a shadowed spot's shaft (`volumetric_fog::gpu::shaft`) went
    # missing twice on the newest-Ubuntu label's Mesa 26 lavapipe and never on
    # this image's Mesa 25, its cause not named, so a move to Mesa 26 is where it
    # may return.
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    # No debuginfo override here: Cargo.toml's `[profile.dev]` (#487) strips the
    # dependency debuginfo that overflowed this runner's disk on #329/#332, so CI
    # builds exactly what a local build does.
    env:
      # A missing adapter fails the canary test instead of skipping every GPU test
      # (#489): the lavapipe step below is what gives this runner one.
      RUSTY_REQUIRE_GPU: "1"
      # The lightmap denoiser (#1884): the OIDN step below installs it, and a
      # missing one fails its canary instead of skipping every OIDN test.
      RUSTY_REQUIRE_OIDN: "1"
      RUSTY_OIDN: ${{ github.workspace }}/../oidn
      OIDN_VERSION: "2.3.3"
      OIDN_SHA256: 3c385230d9e6f63527ba72f2229594dbac5051674219d72e0044b5d0b841796f
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'
      - name: Toolchain (from rust-toolchain.toml)
        if: needs.changes.outputs.code != 'false'
        run: rustup show
      # Only `main` writes caches (#482); PR runs restore the latest one `main`
      # saved. When every PR also saved, a batch of PRs evicted `main`'s warm
      # caches from the repo's 10 GB budget — and a PR's cache is visible only to
      # that PR anyway. Every rust-cache step in these workflows does the same;
      # a job that never runs on `main` borrows a `shared-key` with one that does.
      # One cache per feature set: rust-cache keys on the job's id, which every
      # matrix entry shares, so without `key` the first job to finish on `main`
      # would save its feature set's build for all three. The two `dev` shards
      # build the same thing and share one entry; the second save finds it there.
      - name: Cache cargo registry + target
        if: needs.changes.outputs.code != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libs for winit/wgpu builds
        if: needs.changes.outputs.code != 'false'
        uses: ./.github/actions/system-libs
        with:
          packages: pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      # Mesa's software Vulkan driver (#489). The runner has no GPU, so without it
      # wgpu finds no adapter and every GPU test skips — Linux, a ship platform,
      # had no render coverage at all.
      - name: Software Vulkan driver (lavapipe)
        if: needs.changes.outputs.code != 'false'
        uses: ./.github/actions/system-libs
        with:
          packages: mesa-vulkan-drivers libvulkan1
      # lavapipe comes from the image's apt archive, so the driver under the GPU
      # tests can change with nothing in any diff (#930; compare #769's black
      # frames). The log names the one this run rendered with, and the CPU
      # llvmpipe compiled its shaders for (#2385: a miss only another image's
      # lavapipe showed, on a machine no log named).
      - name: Driver version (Mesa / lavapipe)
        if: needs.changes.outputs.code != 'false'
        run: |
          dpkg-query -W mesa-vulkan-drivers libvulkan1
          lscpu | grep -E 'Model name|Flags'
      # Open Image Denoise (#1884): no apt package, so the pinned, checksummed
      # release, unpacked where RUSTY_OIDN points. rusty opens it at run time, so
      # only the tests need it; a build never links it. Cached by version, as the
      # Blender job caches Blender, and the download retries: one GitHub-releases
      # 504 failed the whole job on its first run.
      - name: Cache Open Image Denoise
        if: needs.changes.outputs.code != 'false'
        id: oidn-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.RUSTY_OIDN }}
          key: oidn-${{ env.OIDN_VERSION }}-x86_64-linux
      - name: Install Open Image Denoise
        if: needs.changes.outputs.code != 'false' && steps.oidn-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/oidn.tgz" \
            "https://github.com/RenderKit/oidn/releases/download/v${OIDN_VERSION}/oidn-${OIDN_VERSION}.x86_64.linux.tar.gz"
          echo "${OIDN_SHA256}  $RUNNER_TEMP/oidn.tgz" | sha256sum -c -
          mkdir -p "$RUSTY_OIDN" && tar -xzf "$RUNNER_TEMP/oidn.tgz" -C "$RUSTY_OIDN" --strip-components=1
      - name: Install cargo-nextest
        if: needs.changes.outputs.code != 'false'
        uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest
      # No separate `cargo build` steps (#482): the test run already compiles every
      # binary target its feature set enables (Cargo builds them for the
      # integration tests), so a build step first only re-proved the same compile.
      # nextest (#484) runs each test in its own process with the settings in
      # .config/nextest.toml; the `ci` profile adds the JUnit report summarised
      # below. It does not run doctests, hence the `--doc` step. A matrix entry
      # runs one of the two test steps, under its own name: the scripts look for
      # each by name (`proved_tree.BUILT`, `verdict.changes.DRIFT_STEP_WORDS`).
      # The two steps do not run the same set: the default entry compiles every
      # test target but runs every test except the `gpu` group (`-E 'not
      # group(gpu*)'`, as `make test`'s default pass), which the `dev` shards run,
      # `dev` adding to the default features (docs/testing.md, *Which suite runs
      # the GPU tests*; the `gpu-default-only` lint holds the premise). Each
      # test step builds first (`--no-run`), then samples the runner's free
      # memory in the background while the tests alone run (`memory_floor.py`),
      # so rustc and the linker are not in the floor; *Slowest tests* prints it
      # beside the accounting.
      - name: Test (engine, default)
        if: needs.changes.outputs.code != 'false' && matrix.features == 'default'
        run: |
          rc=0
          cargo nextest run --no-run --locked || rc=$?
          python3 .github/scripts/memory_floor.py watch mem-floor.txt & watcher=$!
          if [ "$rc" = 0 ]; then
            cargo nextest run --profile ci --locked -E 'not group(gpu*)' --partition "count:${{ matrix.shard }}" || rc=$?
          fi
          cp target/nextest/ci/junit.xml junit-default.xml || true
          kill "$watcher" || true
          exit "$rc"
      - name: Test (engine, dev features)
        if: needs.changes.outputs.code != 'false' && matrix.features == 'dev'
        run: |
          rc=0
          cargo nextest run --no-run --features dev --locked || rc=$?
          python3 .github/scripts/memory_floor.py watch mem-floor.txt & watcher=$!
          if [ "$rc" = 0 ]; then
            cargo nextest run --profile ci --features dev --locked --partition "count:${{ matrix.shard }}" || rc=$?
          fi
          cp target/nextest/ci/junit.xml junit-dev.xml || true
          kill "$watcher" || true
          exit "$rc"
      # The canaries that refuse to skip (the adapter's, `render::test_gpu`, and
      # OIDN's, `bake::denoise::tests`), on every entry: each installs lavapipe
      # and OIDN on its own runner, and a `--partition` puts each canary in one
      # shard only, so without this a shard that lost either would skip its GPU
      # or OIDN tests green. `dev` alone builds the OIDN one; the filter matches
      # what the build has, and nextest fails if it matches nothing.
      - name: Canaries (this runner's GPU and OIDN)
        if: needs.changes.outputs.code != 'false'
        run: >-
          cargo nextest run --locked ${{ matrix.features == 'dev' && '--features dev' || '' }}
          -E 'test(=test_gpu::tests::gpu_adapter_present_when_required)
          | test(=bake::denoise::tests::oidn_is_present_where_ci_requires_it)'
      # The twenty slowest tests of this share and where its time went (the
      # `gpu` group against the rest, per binary), in the log where an agent
      # reads them (#1976, #2326): the job summary is not served by the REST API
      # a cloud session reads, and nextest's log names only tests past a minute.
      # First, the tests over the budget that `main`'s reports of this feature
      # set had under it, annotated, so the PR that adds a slow test is told
      # (#2350). `prefix` and the shard's name are the upload's below.
      - name: Slowest tests
        if: always() && needs.changes.outputs.code != 'false'
        id: slowest
        continue-on-error: true
        uses: ./.github/actions/slowest-tests
        with:
          report: junit-${{ matrix.features }}.xml
          count: "20"
          prefix: junit-build-test-${{ matrix.features }}
          shard: ${{ matrix.shard }}
      # The report itself, for a week, so a shard's timings can be re-read after
      # the job (#2326) and the next PR's run compares against it (#2350). Named
      # by the shard (`1of2`), not by the entry's index, which is not the shard:
      # the composite above builds the name the lookup reads, and outputs it
      # here. A re-run job overwrites its own.
      - name: Upload the JUnit report
        if: always() && needs.changes.outputs.code != 'false'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slowest.outputs.name }}
          path: junit-*.xml
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Doctests (this feature set)
        if: needs.changes.outputs.code != 'false' && startsWith(matrix.shard, '1/')
        run: |
          if [ "${{ matrix.features }}" = dev ]; then
            cargo test --doc --features dev --locked
          else
            cargo test --doc --locked
          fi
      - name: Test summary
        if: always() && needs.changes.outputs.code != 'false'
        uses: test-summary/action@v2
        with:
          paths: junit-*.xml
      - name: Test (lint xtask)
        if: needs.changes.outputs.code != 'false' && matrix.features == 'default'
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked
      # The "Free runner disk" step that ran first here (#329/#332) is gone (#930):
      # since #487 both feature sets fit the stock runner, and since #2264 each
      # job builds only one. This is the evidence, printed after the build so a
      # creeping `target/` shows before it fails.
      - name: Disk headroom
        if: always() && needs.changes.outputs.code != 'false'
        run: df -h / && du -sh target 2>/dev/null || true

  # The macOS leg's split by `main`'s test times (#2397): nextest's `--partition`
  # deals by count or hash, blind to time, so `count:`'s balance moved with the
  # test list (1/2 once had 1.6 times 2/2's GPU-seconds, later within 7%). This job reads the leg's JUnit reports from `main`
  # once, so both shards follow one plan (`.github/scripts/shard_plan.py` says
  # why that matters, and how the last shard takes every test the others did
  # not). The whole job informs: with no report, or this job failing (a step, the
  # checkout, the runner, its timeout), the plan is empty and each shard splits by
  # `count:` (`build-test-cross`'s `if` is `!cancelled()`-guarded for that), and
  # `continue-on-error` keeps a failure here from failing the run, which the merge
  # queue would read as a red head. Same condition as `build-test-cross`. Its
  # `--shards` and `shard:` are the matrix's count (`gate_mirror.plan_gaps`).
  shard-plan:
    needs: changes
    continue-on-error: true
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # main's runs and their JUnit artifacts (main-junit)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
       needs.changes.outputs.code != 'false')
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Main's reports
        continue-on-error: true
        uses: ./.github/actions/main-junit
        with:
          prefix: junit-build-test-cross-macos-26
          shard: 1/2
          dir: ${{ runner.temp }}/shard-baseline
      - name: Plan
        id: plan
        continue-on-error: true
        env:
          BASE: ${{ runner.temp }}/shard-baseline
        run: echo "plan=$(python3 .github/scripts/shard_plan.py plan "$BASE" --shards 2)" >> "$GITHUB_OUTPUT"

  # Verify the wgpu cross-platform claim (issue #121): the build and the `dev`
  # suite on macOS (Metal), the other shipped platform, so the portability premise is
  # checked, not assumed. Separate from `build-test` to avoid renaming that
  # required check.
  # Two shards of the `dev` suite (#2276), as `build-test` splits it on Linux
  # (#2264): the checks are named `build-test-cross (macos-26, 1/2)` and
  # `(macos-26, 2/2)`, and `mergeable` reads them by their base name. The job
  # ran 30-35 min whole against its 35-minute limit; each shard pays the build
  # and half of nextest. The `dev` doctests and the lint xtask (seconds each)
  # ride on 2/2 (about 25 s; the split by time, `shard-plan`, ignores it). Two shards, not
  # three: a train's run and a PR's run then hold four macOS runners, inside
  # the free plan's five concurrent macOS jobs, so no shard queues for one.
  build-test-cross:
    needs: [changes, shard-plan]
    permissions:
      contents: read
      actions: read  # main's runs and their JUnit artifacts (slowest-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, shard: 1/2 }
          - { os: macos-26, shard: 2/2 }
    # A guard against a hang, not a budget the suite must fit (#1976): the job
    # took 23-29 min when it ran both suites and two green runs were cancelled
    # at 30. With the one `dev` suite it took 18.4 (run 42611428872), then crept
    # to 30-35 and was sharded (#2276); `ci_headroom.py` tells the board when a
    # shard passes three quarters of this again. It must
    # stay below the merge queue's `DEADLINE_MINUTES` (45, in
    # `merging/queue/cli.py`), so a hung job is a cancelled run the queue re-runs
    # (#869), not a stall hand-back; `tests/queue/test_macos_timeout.py` holds it.
    timeout-minutes: 35
    runs-on: ${{ matrix.os }}
    # `!cancelled()` and `changes` succeeding: a failed `shard-plan` is no plan,
    # and the shards split by count, never skip.
    if: >-
      !cancelled() && needs.changes.result == 'success' && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
       needs.changes.outputs.code != 'false'))
    env:
      # Metal is always there on macOS; require it (#489).
      RUSTY_REQUIRE_GPU: "1"
      # Homebrew's OIDN, installed below (#1884); require it too.
      RUSTY_REQUIRE_OIDN: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest
      # The lightmap denoiser (#1884), opened at run time from Homebrew's lib.
      - name: Install Open Image Denoise
        run: brew install open-image-denoise
      # macOS uses its native backend and needs no extra system libs; the apt
      # step is Linux-only and lives on the `build-test` job above.
      #
      # Only the `dev` suite and the `dev` doctests run here (#1976, #2276),
      # where `build-test` runs both feature sets. What this leg proves is Metal
      # and the platform, and the `dev` build compiles and tests a superset of
      # the default one: on 2026-11-09 the default list held one test the `dev`
      # list did not (`a_ship_build_has_no_speech_namespace`, a Lua check with
      # no platform code); no `cfg` pairs `target_os` with `not(feature =
      # "dev")`; and the runtime `cfg!(feature = "dev")` branches
      # (`core::project::prepare`, `core/project/agent_tests.rs`) write files,
      # with no platform code. So the default library, its test targets, its
      # binaries and its doctests build only on Linux (`build-test (default,
      # 1/1)`): what only they hold is feature plumbing, which Linux proves.
      # The default doctests were a second, non-`dev` build of about 6 minutes
      # here, and with them one of two shards ran 26.6 of 35 min (run
      # 43947625456), past three quarters.
      - name: Test (engine, dev features)
        shell: bash
        env:
          PLAN: ${{ needs.shard-plan.outputs.plan }}
        run: |
          rc=0
          cargo nextest run --no-run --features dev --locked || rc=$?
          python3 .github/scripts/memory_floor.py watch mem-floor.txt & watcher=$!
          if [ "$rc" = 0 ]; then
            # This shard's tests from `shard-plan`'s plan, or `count:` with none
            # (#2397); a loop, not `mapfile`, which macOS's bash 3.2 lacks. The
            # script's status is read, not dropped as a process substitution's
            # is: a crash or no arguments splits by count, never runs the whole
            # suite in every shard.
            split=()
            if planned=$(python3 .github/scripts/shard_plan.py args "${{ matrix.shard }}"); then
              while IFS= read -r arg; do if [ -n "$arg" ]; then split+=("$arg"); fi; done <<< "$planned"
            else
              echo "split: the plan reader failed (exit $?, its error above)"
            fi
            if [ "${#split[@]}" = 0 ]; then
              echo "split: by count (\`count:${{ matrix.shard }}\`): the plan gave no arguments"
              split=(--partition "count:${{ matrix.shard }}")
            fi
            cargo nextest run --profile ci --features dev --locked "${split[@]}" || rc=$?
          fi
          cp target/nextest/ci/junit.xml junit-dev.xml || true
          kill "$watcher" || true
          exit "$rc"
      # A split puts each canary in one shard only, so every shard runs them
      # again (#2264, #2276): a shard that lost Metal or OIDN fails, never skips.
      - name: Canaries (this runner's GPU and OIDN)
        run: >-
          cargo nextest run --locked --features dev
          -E 'test(=test_gpu::tests::gpu_adapter_present_when_required)
          | test(=bake::denoise::tests::oidn_is_present_where_ci_requires_it)'
      # The ten slowest tests and where the shard's time went, in the log where
      # an agent reads them (#1976, #2326): the job summary is not served by the
      # REST API a cloud session reads. The cores are the runner's own, so the
      # Metal leg's GPU-or-cores balance reads beside Linux's. First, the tests
      # newly over the budget against `main`'s Metal reports (#2350).
      - name: Slowest tests
        if: always()
        id: slowest
        continue-on-error: true
        uses: ./.github/actions/slowest-tests
        with:
          report: junit-dev.xml
          prefix: junit-build-test-cross-${{ matrix.os }}
          shard: ${{ matrix.shard }}
      - name: Upload the JUnit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slowest.outputs.name }}
          path: junit-*.xml
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Doctests (dev features)
        if: matrix.shard == '2/2'
        run: cargo test --doc --features dev --locked
      - name: Test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: junit-*.xml
      - name: Test (lint xtask)
        if: matrix.shard == '2/2'
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked

  # The `.blend` import through a real Blender (#1072). Its tests are `#[ignore]`d
  # in every other run, since rusty requires Blender but a runner has none; this
  # job installs one and runs exactly those (`--run-ignored only`), so the
  # conversion is proven somewhere on every code change; `dev` builds the `export`
  # and `play` binaries the export's test drives (#1267). The tarball is cached by
  # version; `RUSTY_BLENDER` names it, as a non-standard install would.
  blender:
    needs: changes
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
       needs.changes.outputs.code != 'false')
    env:
      BLENDER_VERSION: "5.2.3"
      BLENDER_SERIES: "5.2"
      # The filter below runs no GPU test; set as on every suite job (#978).
      RUSTY_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libs for winit/wgpu builds
        uses: ./.github/actions/system-libs
        with:
          packages: pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      - name: Install cargo-nextest
        uses: ./.github/actions/install-tool
        with:
          tool: cargo-nextest
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v6
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSfL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1
      - name: Blender version
        run: ~/blender/blender --version | head -1
      - name: Test (the .blend import, through Blender)
        run: |
          export RUSTY_BLENDER="$HOME/blender/blender"
          cargo nextest run --profile ci --locked --features dev --run-ignored only \
            -E 'test(/convert::blend::|^export::blend::/)'

  # Runs nightly with the others — see the `schedule` trigger note.
  deny:
    needs: changes
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
       needs.changes.outputs.code != 'false')
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Blocking supply-chain gate (no continue-on-error): a new RUSTSEC
          # advisory on any transitive dep fails the build, and licenses must be
          # on the explicit allow-list in deny.toml. v2 ships a newer cargo-deny
          # whose parser supports CVSS 4.0 advisories (v1 errors on those).
          # `bans` warns; `sources` denies any git source but scorsese (#413).
          # Policy lives in deny.toml.
          command: check advisories bans sources licenses

  # `fuzz/` is its own workspace (cargo-fuzz), so no other job compiles it and
  # its target could stop building with nothing red. This checks it, on the
  # pinned stable toolchain (only *running* libFuzzer needs nightly), against a
  # lock derived from the root one: `make fuzz-check`, which holds the failure hint. A second
  # cold engine build in its own target dir, so on a PR or push it runs only
  # when `changes`' `fuzz` filter says the diff can break that build (`make
  # gates` reads the same filter); skipped otherwise, which `ci-gate` passes.
  # The nightly and a dispatch always run it. No rust-cache: the repository's
  # Actions cache is past its quota, so a new entry evicts one the gating jobs
  # need, and a cold check is short and runs on few pull requests.
  fuzz-check:
    needs: changes
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
       needs.changes.outputs.code != 'false' && needs.changes.outputs.fuzz == 'true')
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: System libs for winit/wgpu builds
        uses: ./.github/actions/system-libs
        with:
          packages: pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      - name: Check the fuzz target (stable, the root lock's versions)
        run: make fuzz-check

  # The single required status check for ci.yml (issue #229). `main`'s ruleset,
  # kept as code in `.github/rulesets/main.json` (#491; `make ruleset` checks it is
  # live), requires THIS job from GitHub Actions, not build-test / build-test-cross
  # / deny by name, and not strict (the queue may merge a head behind a
  # Markdown-only `main`, #587). Renaming it, giving it a `name:` or putting a
  # `paths` filter on the workflow would leave every PR waiting on a check that
  # never reports; `tests/ruleset/test_reporting.py` refuses all three. The ruleset
  # cannot tell a draft's run (gate green, nothing built) from a ready run of the
  # same commit, so `make mergeable` still judges every merge. It always
  # runs and collapses those gating jobs into one result: it passes when each either
  # succeeded or was legitimately skipped (e.g. build-test-cross on a Markdown-only
  # PR) and fails only on a real failure or cancellation. That permanently retires the
  # skipped-required-check deadlock (#218/#228) — a skipped gating job can no longer
  # leave a required check stuck "Expected" and wedge a docs-only PR. When a gating
  # job is added or removed, update this `needs:` list; the ruleset never needs
  # touching again. (lint.yml exposes the analogous `lint-gate`.)
  #
  # `changes` is in `needs:` and must SUCCEED (#480): every gating job depends on
  # it, so when it fails they are all skipped — and "skipped passes" alone would
  # report a run where nothing was checked as green. That happened on every
  # post-merge run until #480 (`changes` failed, `ci-gate` said success).
  ci-gate:
    needs: [changes, build-test, build-test-cross, blender, deny, fuzz-check]
    # `!cancelled()`, not `always()` (#515): a failed or skipped gating job still
    # reaches this gate and fails it, but a run cancelled because a newer push
    # superseded it (#482) leaves no red `ci-gate` beside the live one.
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Gate on the correctness jobs (success or skipped passes)
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::the changes job concluded '$CHANGES', so every gating job was skipped and nothing was checked"
            exit 1
          fi
          echo "gating job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required gating job concluded '$r'"; exit 1 ;;
            esac
          done
          echo 'all gating jobs passed (success or skipped)'
