name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

jobs:
  # Detect whether the PR changes anything other than Markdown. Markdown-only PRs
  # skip the heavy Rust jobs below (see the merging note in CLAUDE.md). We gate via
  # job-level `if` (a skipped job still satisfies a required check) rather than
  # workflow `paths-ignore` (which would leave a required check stuck pending).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - '!**/*.md'

  build-test:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && needs.changes.outputs.code != 'false')
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Build (default)
        run: cargo build --locked
      - name: Build (dev features)
        run: cargo build --features dev --locked
      - name: Test (engine, default)
        run: cargo test --locked
      - name: Test (engine, dev features)
        run: cargo test --features dev --locked
      - name: Test (lint xtask)
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked

  coverage:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && needs.changes.outputs.code != 'false')
    # Informational to start (issue #117): publish what the suite exercises so the
    # mutation/property work can be aimed. No hard floor yet — we ratchet to a
    # regression gate once a baseline is recorded. The ~85% target on the
    # deterministic sim modules (app/scripting/physics/navigation) and the
    # platform-layer exemption (main.rs, render, dev) are documented in
    # docs/testing.md. `continue-on-error` keeps this from blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Add llvm-tools-preview (required by cargo-llvm-cov)
        run: rustup component add llvm-tools-preview
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage (both feature sets, accumulated)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --locked
          cargo llvm-cov --no-report --features dev --locked
      - name: Whole-crate summary
        run: |
          {
            echo '### Coverage summary (whole crate)'
            echo ''
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deterministic sim-module coverage (target ~85%, informational)
        run: |
          # Restrict the report to the sim modules by ignoring everything else.
          # The `regex` crate (used by llvm-cov) has no look-around, so we list the
          # non-sim paths explicitly rather than negative-matching the sim ones.
          {
            echo '### Sim-module coverage — app, scripting, physics, navigation (target ~85%)'
            echo ''
            echo '```'
            cargo llvm-cov report --summary-only \
              --ignore-filename-regex 'src/(render|dev|api|components|core|ecs|scene|time)/|src/(main|lib)\.rs|src/bin/|tools/'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deny:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && needs.changes.outputs.code != 'false')
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Blocking supply-chain gate (no continue-on-error): a new RUSTSEC
          # advisory on any transitive dep fails the build, and licenses must be
          # on the explicit allow-list in deny.toml. v2 ships a newer cargo-deny
          # whose parser supports CVSS 4.0 advisories (v1 errors on those).
          # `bans`/`sources` stay as-is (warn). Policy lives in deny.toml.
          command: check advisories bans sources licenses

  mutants:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && needs.changes.outputs.code != 'false')
    # Report-only to start (#122): mutation testing audits whether the tests
    # actually catch bugs — the headline guardrail against green-but-vacuous
    # agent-written tests. Scoped to the deterministic sim (app/scripting/physics/
    # navigation), the pure-logic part where a silent bug hurts most; surviving
    # mutants are published as an artifact. Ratchet to a hard gate once the
    # survivor list is burned down. `continue-on-error` keeps it from blocking
    # merges meanwhile.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutation test (deterministic sim, report-only)
        # Build/test with the dev feature so the headless-harness sim tests run
        # too. Scoped by --file to the sim modules; the timeout multiplier guards
        # against mutants that induce infinite loops.
        run: |
          cargo mutants --no-shuffle --timeout-multiplier 3 \
            --file 'src/app/**/*.rs' \
            --file 'src/scripting/**/*.rs' \
            --file 'src/physics/**/*.rs' \
            --file 'src/navigation/**/*.rs' \
            -- --features dev
      - name: Upload surviving-mutant report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
