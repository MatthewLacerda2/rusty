name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Build
        run: cargo build --locked
      - name: Test (engine)
        run: cargo test --locked
      - name: Test (lint xtask)
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked

  deny:
    runs-on: ubuntu-latest
    continue-on-error: true # report-only supply-chain audit
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # v2 ships a newer cargo-deny whose parser supports CVSS 4.0 advisories
          # (v1 errors on RUSTSEC entries using CVSS 4.0). Scope to advisories/bans/
          # sources; licenses stay un-gated for now to avoid allow-list churn.
          command: check advisories bans sources
