name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Gates only (#750). Mutation and coverage are signals and have their own
  # workflows, off pull requests and off every merge: `mutants-sweep.yml` and
  # `coverage.yml` run weekly, and `mutants-on-request.yml` mutates exactly what
  # someone names (`make mutants-remote SCOPE=...`). A signal that ran here held
  # runners the merge queue was waiting on, for a report that could not change
  # whether anything merged.
  push:
    branches: [main]
  # Which gating jobs also run on the schedule is a decision, not a side effect
  # (#480): `deny` does — advisories land against code that has not changed, so a
  # nightly check is how a new RUSTSEC reaches us between merges (RUSTSEC-2026-0257
  # was spotted that way), and `ci-gate` goes red with it. `build-test` and
  # `build-test-cross` do not: with the toolchain and Cargo.lock pinned, rebuilding
  # an unchanged `main` re-proves what its `push` run already proved. (The
  # nightly Windows run is a signal in `windows.yml`, #741.) Off the hour, where
  # GitHub's scheduler is least backed up.
  schedule:
    - cron: '7 3 * * *'
  # A proof run of a branch: the gates, nothing else.
  workflow_dispatch:

# Cancel superseded runs (#482), and only those (#930): a new push to a ready PR
# makes its previous run stale, so that run is cancelled instead of finishing
# beside the new one. Only a *ready* PR's runs share a group; a draft's runs
# (whose gating jobs skip anyway) and every other event (push to `main`, the
# nightly schedule, manual) are keyed on their own run id, so each of those
# finishes — a shared group would still let a newer run replace a *pending*
# one, even with cancel-in-progress off. Only a push (`synchronize`) cancels:
# `ready_for_review` and `reopened` carry the same commit as the run they would
# meet, so cancelling it would throw away a run of the head. `mergeable`'s
# `superseded` (#515, #562) still tells the two apart, as a safety net.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  # Detect whether the PR changes anything other than Markdown. On a Markdown-only
  # PR the heavy Rust *steps* below are skipped, but the required job still RUNS and
  # reports `success` (a job whose steps all skip still succeeds). This is on
  # purpose: the branch ruleset treats a *skipped* required check as
  # "Expected"/unsatisfied — NOT a pass — so skipping the whole job would wedge a
  # docs-only PR as unmergeable (issue #218). So we keep the cheap-docs-PR path by
  # guarding the required job's steps on `code`, never by skipping the job itself.
  # See the merging note in CLAUDE.md.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # On `pull_request` paths-filter reads the changed files from the API and
      # needs no clone; on `push` it diffs `github.event.before..HEAD` in a local
      # repo, so without this checkout it dies with git exit 128 — which failed
      # every post-merge run (#480).
      # paths-filter fetches `before` itself if the shallow clone lacks it.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        id: filter
        # Runs on PRs (diff vs. base) and on push to main (diff of the merge
        # commit), so a docs-only merge skips the build steps just as a
        # docs-only PR does.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            code:
              - '!**/*.md'
              # The API-doc drift tests parse it: an edit to it alone is code (#525),
              # one file per namespace since #569.
              - 'docs/api/**'

  # The Linux build+test. Kept as its own job (not folded into the OS matrix
  # below) so the `build-test` status-check name — referenced by the branch
  # ruleset as a required check — is preserved exactly. The job ALWAYS runs on a
  # non-draft PR so the required check reports `success` (never
  # `skipped`); the build/test steps are guarded on `code`, so a Markdown-only PR
  # is a fast no-op success (issue #218).
  #
  # The events each gating job runs on are listed explicitly (#480). A bare
  # `github.event.pull_request.draft == false` also matches `push` and `schedule`
  # — there is no PR, and GitHub's loose equality makes null == false — so the
  # old condition ran these jobs on events nobody had chosen. `push` is kept on
  # purpose: it builds the commit that actually landed on `main`.
  build-test:
    needs: changes
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    # No debuginfo override here: Cargo.toml's `[profile.dev]` (#487) strips the
    # dependency debuginfo that overflowed this runner's disk on #329/#332, so CI
    # builds exactly what a local build does.
    env:
      # A missing adapter fails the canary test instead of skipping every GPU test
      # (#489): the lavapipe step below is what gives this runner one.
      RUSTY_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'
      - name: Toolchain (from rust-toolchain.toml)
        if: needs.changes.outputs.code != 'false'
        run: rustup show
      # Only `main` writes caches (#482); PR runs restore the latest one `main`
      # saved. When every PR also saved, a batch of PRs evicted `main`'s warm
      # caches from the repo's 10 GB budget — and a PR's cache is visible only to
      # that PR anyway. Every rust-cache step in these workflows does the same;
      # a job that never runs on `main` borrows a `shared-key` with one that does.
      - name: Cache cargo registry + target
        if: needs.changes.outputs.code != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libs for winit/wgpu builds
        if: needs.changes.outputs.code != 'false'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      # Mesa's software Vulkan driver (#489). The runner has no GPU, so without it
      # wgpu finds no adapter and every GPU test skips — Linux, a ship platform,
      # had no render coverage at all.
      - name: Software Vulkan driver (lavapipe)
        if: needs.changes.outputs.code != 'false'
        run: sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      # lavapipe comes from the image's apt archive, so the driver under the GPU
      # tests can change with nothing in any diff (#930; compare #769's black
      # frames). The log names the one this run rendered with.
      - name: Driver version (Mesa / lavapipe)
        if: needs.changes.outputs.code != 'false'
        run: dpkg-query -W mesa-vulkan-drivers libvulkan1
      - name: Install cargo-nextest
        if: needs.changes.outputs.code != 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # No separate `cargo build` steps (#482): the test run already compiles every
      # binary target its feature set enables (Cargo builds them for the
      # integration tests), so a build step first only re-proved the same compile.
      # nextest (#484) runs each test in its own process with the settings in
      # .config/nextest.toml; the `ci` profile adds the JUnit report summarised
      # below. It does not run doctests, hence the `--doc` step.
      - name: Test (engine, default)
        if: needs.changes.outputs.code != 'false'
        run: |
          rc=0
          cargo nextest run --profile ci --locked || rc=$?
          cp target/nextest/ci/junit.xml junit-default.xml || true
          exit "$rc"
      - name: Test (engine, dev features)
        if: needs.changes.outputs.code != 'false'
        run: |
          rc=0
          cargo nextest run --profile ci --features dev --locked || rc=$?
          cp target/nextest/ci/junit.xml junit-dev.xml || true
          exit "$rc"
      - name: Doctests (both feature sets)
        if: needs.changes.outputs.code != 'false'
        run: |
          cargo test --doc --locked
          cargo test --doc --features dev --locked
      - name: Test summary
        if: always() && needs.changes.outputs.code != 'false'
        uses: test-summary/action@v2
        with:
          paths: junit-*.xml
      - name: Test (lint xtask)
        if: needs.changes.outputs.code != 'false'
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked
      # The "Free runner disk" step that ran first here (#329/#332) is gone (#930):
      # since #487 both feature sets fit the stock runner. This is the evidence,
      # printed after both builds so a creeping `target/` shows before it fails.
      - name: Disk headroom
        if: always() && needs.changes.outputs.code != 'false'
        run: df -h / && du -sh target 2>/dev/null || true

  # Verify the wgpu cross-platform claim (issue #121): the same build + test on
  # macOS (Metal), the other shipped platform, so the portability premise is
  # checked, not assumed. Separate from `build-test` to avoid renaming that
  # required check. Windows is not a shipped platform yet, so its run is a signal
  # in `windows.yml` (#741), outside this gate; keep the two jobs' steps in step.
  # A one-entry matrix, so the check is named `build-test-cross (macos-26)`;
  # `mergeable` reads it by its base name.
  build-test-cross:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
       needs.changes.outputs.code != 'false')
    env:
      # Metal is always there on macOS; require it (#489).
      RUSTY_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # macOS uses its native backend and needs no extra system libs; the apt
      # step is Linux-only and lives on the `build-test` job above. Same runner
      # and steps as build-test (#484); bash so `windows.yml` can run the same script.
      - name: Test (engine, default)
        shell: bash
        run: |
          rc=0
          cargo nextest run --profile ci --locked || rc=$?
          cp target/nextest/ci/junit.xml junit-default.xml || true
          exit "$rc"
      - name: Test (engine, dev features)
        shell: bash
        run: |
          rc=0
          cargo nextest run --profile ci --features dev --locked || rc=$?
          cp target/nextest/ci/junit.xml junit-dev.xml || true
          exit "$rc"
      - name: Doctests (both feature sets)
        shell: bash
        run: |
          cargo test --doc --locked
          cargo test --doc --features dev --locked
      - name: Test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: junit-*.xml
      - name: Test (lint xtask)
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked

  # The `.blend` import through a real Blender (#1072). Its tests are `#[ignore]`d
  # in every other run, since rusty requires Blender but a runner has none; this
  # job installs one and runs exactly those (`--run-ignored only`), so the
  # conversion is proven somewhere on every code change. The tarball is cached by
  # version; `RUSTY_BLENDER` names it, as a non-standard install would.
  blender:
    needs: changes
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
       needs.changes.outputs.code != 'false')
    env:
      BLENDER_VERSION: "5.2.3"
      BLENDER_SERIES: "5.2"
      # The filter below runs no GPU test; set as on every suite job (#978).
      RUSTY_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSfL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1
      - name: Blender version
        run: ~/blender/blender --version | head -1
      - name: Test (the .blend import, through Blender)
        run: |
          export RUSTY_BLENDER="$HOME/blender/blender"
          cargo nextest run --profile ci --locked --run-ignored only -E 'test(/convert::blend::/)'

  # The one gating job that also runs nightly — see the `schedule` trigger note.
  deny:
    needs: changes
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
       needs.changes.outputs.code != 'false')
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Blocking supply-chain gate (no continue-on-error): a new RUSTSEC
          # advisory on any transitive dep fails the build, and licenses must be
          # on the explicit allow-list in deny.toml. v2 ships a newer cargo-deny
          # whose parser supports CVSS 4.0 advisories (v1 errors on those).
          # `bans` warns; `sources` denies any git source but scorsese (#413).
          # Policy lives in deny.toml.
          command: check advisories bans sources licenses

  # The single required status check for ci.yml (issue #229). Branch protection
  # requires THIS job, not build-test / build-test-cross / deny by name. It always
  # runs and collapses those gating jobs into one result: it passes when each either
  # succeeded or was legitimately skipped (e.g. build-test-cross on a Markdown-only
  # PR) and fails only on a real failure or cancellation. That permanently retires the
  # skipped-required-check deadlock (#218/#228) — a skipped gating job can no longer
  # leave a required check stuck "Expected" and wedge a docs-only PR. When a gating
  # job is added or removed, update this `needs:` list; branch protection never needs
  # touching again. (lint.yml exposes the analogous `lint-gate`.)
  #
  # `changes` is in `needs:` and must SUCCEED (#480): every gating job depends on
  # it, so when it fails they are all skipped — and "skipped passes" alone would
  # report a run where nothing was checked as green. That happened on every
  # post-merge run until #480 (`changes` failed, `ci-gate` said success).
  ci-gate:
    needs: [changes, build-test, build-test-cross, blender, deny]
    # `!cancelled()`, not `always()` (#515): a failed or skipped gating job still
    # reaches this gate and fails it, but a run cancelled because a newer push
    # superseded it (#482) leaves no red `ci-gate` beside the live one.
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Gate on the correctness jobs (success or skipped passes)
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::the changes job concluded '$CHANGES', so every gating job was skipped and nothing was checked"
            exit 1
          fi
          echo "gating job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required gating job concluded '$r'"; exit 1 ;;
            esac
          done
          echo 'all gating jobs passed (success or skipped)'
