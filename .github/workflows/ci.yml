name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

jobs:
  # Detect whether the PR changes anything other than Markdown. Markdown-only PRs
  # skip the heavy Rust jobs below (see the merging note in CLAUDE.md). We gate via
  # job-level `if` (a skipped job still satisfies a required check) rather than
  # workflow `paths-ignore` (which would leave a required check stuck pending).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - '!**/*.md'

  build-test:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && needs.changes.outputs.code != 'false')
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Build (default)
        run: cargo build --locked
      - name: Build (dev features)
        run: cargo build --features dev --locked
      - name: Test (engine, default)
        run: cargo test --locked
      - name: Test (engine, dev features)
        run: cargo test --features dev --locked
      - name: Test (lint xtask)
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked

  deny:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && needs.changes.outputs.code != 'false')
    continue-on-error: true # report-only supply-chain audit
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # v2 ships a newer cargo-deny whose parser supports CVSS 4.0 advisories
          # (v1 errors on RUSTSEC entries using CVSS 4.0). Scope to advisories/bans/
          # sources; licenses stay un-gated for now to avoid allow-list churn.
          command: check advisories bans sources
