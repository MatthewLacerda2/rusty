name: ci-pr-closed
# A closed or merged PR's `ci` run still in flight (usually `mutants-pr`) holds a
# runner for a report nobody reads, while open PRs' gates queue (#705). This run
# joins that PR's `ci` concurrency group — `ci.yml` names it `ci-pr-<number>` —
# with cancel-in-progress, which cancels the stale run, then ends at once.
# A separate workflow rather than a `closed` type in ci.yml, where every job's
# `if` would have to learn to skip it.
on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Cancelled any ci run still going for PR #${{ github.event.pull_request.number }}."
