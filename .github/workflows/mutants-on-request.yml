# Mutation testing on request: exactly the code someone names, on GitHub's
# runners, with a report readable without opening a log (#750).
#
# Pull requests carry no mutation job. Mutation is a signal — nothing it finds
# may block a merge — and the per-PR job held runners the merge queue was
# waiting on, for a report that could not change whether anything merged.
# What replaces it is not silence: whoever just wrote tricky code asks for
# exactly that code to be mutated, and reads the answer.
#
# By hand, the way in is `make mutants-remote SCOPE=...`, which dispatches this
# on the current branch, waits, downloads the report and prints it
# (`.github/scripts/mutants-remote.py`). Or directly, from `gh` or a cloud
# session's GitHub tools (`actions_run_trigger`), with `scope` and optionally
# `request` (`commit` and `pr` are the merge queue's, below):
#
#   gh workflow run mutants-on-request.yml --ref <branch> -f scope='<scope>'
#
# The scope is `diff` (this branch against `origin/main`) or path globs
# (`crates/physics/src/**`), read by `.github/scripts/mutants-scope.py`, whose
# docstring says why both become `--in-diff`. The scope and the request id
# `make mutants-remote` generates are in the run's name: a dispatch returns no
# run id, so the id is how the command finds *its* run.
#
# Never a gate and never on a pull request. Unlike the weekly sweep it goes
# red when it has no honest report to give — a path scope with nothing to
# mutate, a baseline that does not build — because its caller must tell "no
# survivors" from "no answer", and the run's conclusion is what it reads.
# Survivors are a result and never turn it red.
#
# The merge queue is the usual caller (#1934): a coder writes a `Mutation:`
# line in its pull request, and after the queue merges it, it dispatches this
# on `main` with `commit` (the squash commit, checked out and diffed against
# its parent) and `pr` (where the report goes), at most two at a time
# (`.github/scripts/merging/after/`). Dispatching at ready, as coders did
# before, held a third of the account's runners on 2026-11-08 while the
# gating `ci` runs waited 20-40 minutes behind them.
#
# When the branch has an open or merged pull request, the report is also
# posted on it, as one comment each later run edits in place (#912): a cloud
# coder ends at ready and is gone before its run finishes, the queue has often
# merged the branch by then, and the pull request is where the orchestrator
# and the reviewer look.
#
# A `workflow_dispatch` workflow can be dispatched only once the file is on
# the default branch; `--ref` then picks the code it runs against.
name: mutants-on-request
run-name: "mutants: ${{ inputs.scope }} [${{ inputs.request }}]"

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "`diff`, or space-separated path globs (crates/physics/src/**)"
        required: true
        type: string
      request:
        description: An id for the caller to find this run by; any short string
        required: false
        default: by-hand
        type: string
      commit:
        description: Mutate this commit's own change, checked out (the merge queue's; with scope `diff`)
        required: false
        default: ""
        type: string
      pr:
        description: Post the report on this pull request rather than the branch's
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One run per branch (#1530). Coders used to dispatch a scoped run when they
# readied, and again on each re-brief (the queue dispatches after the merge
# now, #1934, but a by-hand `make mutants-remote` still runs on a branch);
# without this every older run kept its runner for its full course, and on 2026-10-28 ten at once left
# the merge queue's `ci` runs queued for 45 minutes. A newer dispatch on the
# same ref cancels the older run. The group is a literal string, not
# `${{ github.workflow }}`, because `mutants-cancel.yml` joins the same group
# when the branch's pull request closes unmerged, and that is what stops a run
# whose report nobody would read. A merged branch's run finishes and reports.
# `ci.yml` and `lint.yml` use groups of their own (`ci-…`, `lint-…`), so
# nothing here can cancel a gating run.
#
# On `main` each run is its own group (its run id): the merge queue's runs for
# merged pull requests (#1934) and the orchestrator's narrower re-asks
# (`ci-merge`, *Triaging a survivor*) are separate questions, not
# replacements, so one must not cancel another. The queue holds its own runs
# to two at a time, which a concurrency group could not do without
# cancelling the waiting ones.
#
# Concurrency cannot rank runs: GitHub has no priority between workflows on
# hosted runners, and one group for every branch would keep a single pending
# run and silently cancel the other requests. So mutation is held to one run
# per open branch, not to fewer runners than CI needs.
concurrency:
  group: mutants-on-request-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    runs-on: ubuntu-latest
    # Job-level, so only this job's token may comment: `pull-requests: write`
    # is for posting the report on the branch's pull request (#912).
    permissions:
      contents: read
      pull-requests: write
    # One runner: a request is a file or a branch's diff, usually tens of
    # mutants at ~3.7 min each caught (~12.5 min for a missed one, which runs
    # the whole suite). A scope too big for the budget below is stopped
    # by it, and the report says how many planned mutants it never reached.
    timeout-minutes: 180
    env:
      # Measured from the job's start: slow setup leaves less, not overtime.
      BUDGET_SECONDS: 9900   # 2 h 45
      # A missing adapter fails the canary test, so the baseline fails and the
      # run goes red rather than reporting GPU-covered mutants as MISSED (#785).
      RUSTY_REQUIRE_GPU: "1"
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # Full history: a `diff` scope needs `origin/main` and the merge base.
      # A queue request checks out its squash commit: `main` may have moved since.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      # The tree is `inputs.commit`, which may predate a step this job calls
      # (`install-tool`, #1973; `system-libs`, #2101): take `.github/actions`
      # from the workflow's own commit, so a request queued before a change to
      # them still runs. Before the first local action, which is `system-libs`.
      - name: Shared steps from the workflow's commit
        run: git checkout "$GITHUB_SHA" -- .github/actions
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # The weekly sweep saves this key from `main`; a request only reads it.
          shared-key: mutants
          save-if: false
      - name: System libs for winit/wgpu builds
        uses: ./.github/actions/system-libs
        with:
          packages: pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      # Mesa's software Vulkan driver, as in `ci.yml` (#489, #785). Without it
      # wgpu finds no adapter, every GPU test skips, and every mutant in code
      # only the GPU tests reach (render, captures) reports MISSED however well
      # it is tested. `RUSTY_REQUIRE_GPU` (job env) turns a lost driver into a
      # failed baseline instead of that silence.
      - name: Software Vulkan driver (lavapipe)
        uses: ./.github/actions/system-libs
        with:
          packages: mesa-vulkan-drivers libvulkan1
      # nextest too: mutants run under it (`--test-tool nextest`, below).
      - name: Install cargo-mutants and cargo-nextest
        uses: ./.github/actions/install-tool
        with:
          tool: cargo-mutants,cargo-nextest

      - name: What was asked for
        env:
          SCOPE: ${{ inputs.scope }}
          COMMIT: ${{ inputs.commit }}
        run: python3 .github/scripts/mutants-scope.py resolve "$SCOPE" --commit "$COMMIT" --out plan.json --diff scope.diff

      # `--list` builds nothing and answers in seconds, so the size of the
      # request and what it covers are known before anything compiles.
      - name: How much of it there is to mutate
        id: plan
        run: |
          set -euo pipefail
          # An empty diff (a branch that changed no Rust) plans nothing; it is
          # not handed to cargo-mutants, which refuses an empty `--in-diff`.
          if [ -s scope.diff ]; then
            cargo mutants --list --workspace --json --in-diff scope.diff > planned.json
          else
            : > planned.json
          fi
          python3 .github/scripts/mutants-scope.py check plan.json planned.json > scope.txt \
            || { cat scope.txt; echo "::error::$(cat scope.txt)"; exit 1; }
          cat scope.txt
          in_scope=$(python3 -c 'import json,sys; t=open(sys.argv[1]).read().strip(); print(len(json.loads(t)) if t else 0)' planned.json)
          echo "in_scope=$in_scope" >> "$GITHUB_OUTPUT"

      # The baseline is run here, not by cargo-mutants (`--baseline skip`, #2164):
      # cargo-mutants 27 builds and tests its own baseline with `--package` set
      # to the mutated packages only, whatever `test_workspace` says, while each
      # mutant runs the whole workspace's tests. A moved crate's baseline then
      # timed only that crate's tests and every mutant overran 3x of it (#2160),
      # and a member without a `dev` feature failed it outright (#2155). This
      # step runs exactly what each mutant will: the same build, then the same
      # tests, timed, and the timeout is 3x that test time. `mutants-sweep.yml`
      # does the same; `test_baseline.py` (`make scripts`) holds
      # the two commands to cargo-mutants' own arguments. A baseline that fails
      # turns the run red: there is no honest report to give.
      #
      # Under nextest (`--test-tool nextest`, #1844), the gate's runner: a
      # process per test and the `gpu` test group, so the run covers the unit
      # and integration tests as the gates do (not the doctests: nextest doesn't
      # run them, `make test` does). Under plain `cargo test` it broke four times
      # on a test that passed the gate (#1042, #1069, #1337, #1844); runner
      # independence is `cargo-test.yml`'s nightly signal, not this one's.
      # `--fail-fast` overrides the profile's `fail-fast = false` (right for the
      # gate's summary) so a caught mutant stops at its first failing test.
      # Memory cap and test-thread bound as the sweep (`mutants-sweep.yml` says why).
      - name: Baseline
        id: baseline
        if: steps.plan.outputs.in_scope != '0'
        run: |
          set -euo pipefail
          ulimit -v 8388608
          cargo nextest run --no-run --verbose --workspace --features=dev
          start=$(date +%s)
          cargo nextest run --verbose --workspace --features=dev --fail-fast --test-threads 2
          secs=$(( $(date +%s) - start ))
          timeout=$(( secs * 3 > 60 ? secs * 3 : 60 ))
          echo "Baseline: the workspace's tests in ${secs}s, so each mutant's test timeout is ${timeout}s." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "timeout=$timeout" >> "$GITHUB_OUTPUT"

      # `--features dev` is cargo-mutants' own flag, so it reaches the build
      # phase too: after `--` it reached only the test phase, which then
      # recompiled the workspace with `dev` inside the mutant's test timeout.
      # `--in-place` mutates this checkout, whose `target/` the baseline built,
      # so the first mutant does not rebuild the workspace in a copy. SIGINT at
      # the budget is cargo-mutants' Ctrl-C: it stops cleanly and keeps what it
      # measured. When setup and the baseline already spent the budget, no
      # mutant runs and the run reads as stopped at its budget (124): `timeout
      # 0s` would disable the limit, and a negative one exits 125, read as broken.
      - name: Mutate
        id: mutate
        if: steps.plan.outputs.in_scope != '0'
        env:
          TIMEOUT: ${{ steps.baseline.outputs.timeout }}
        run: |
          budget=$(( BUDGET_SECONDS - ($(date +%s) - JOB_STARTED) ))
          ulimit -v 8388608
          rc=0
          if [ "$budget" -le 0 ]; then
            echo "::warning::setup and the baseline spent the ${BUDGET_SECONDS}s budget; no mutant ran"
            rc=124
          else
            timeout --signal=INT --kill-after=60s "${budget}s" \
              cargo mutants --workspace --test-tool nextest --no-shuffle --baseline skip --in-place \
                --timeout "$TIMEOUT" --features dev \
                --in-diff scope.diff -- --fail-fast --test-threads 2 || rc=$?
          fi
          echo "status=$rc" >> "$GITHUB_OUTPUT"

      # Red when cargo-mutants broke (any status but finished or stopped at
      # its budget): then there is no honest report to write.
      - name: Render the report
        env:
          IN_SCOPE: ${{ steps.plan.outputs.in_scope }}
          STATUS: ${{ steps.mutate.outputs.status || '0' }}
        run: |
          python3 .github/scripts/mutants-report.py mutants.out scope.txt \
            --in-scope "$IN_SCOPE" --exit "$STATUS" --out report
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
          # And in the log, for a caller with no `gh` to download the artifact
          # (a cloud session reads the job log through its GitHub tools).
          cat report/report.md report/survivors.diff

      # The same report on the branch's open pull request, or its merged one
      # when the queue merged it first (or the one the run names, `pr`), one comment edited in place by each
      # later run; a branch with neither (a run on `main`, a scratch branch, a
      # PR closed unmerged) gets no comment (#912, #1530).
      # `continue-on-error`: a comment that could not be posted is a lost
      # delivery, not a lost measurement, and survivors never turn this run
      # red, so neither may this. The report is still in the summary and log.
      - name: Post the report on the pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ inputs.pr }}
        run: |
          python3 .github/scripts/mutants-pr-comment.py report/report.md \
            --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --run-url "$RUN_URL" ${PR:+--pr "$PR"}

      - name: Keep the report
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: report/
          if-no-files-found: error
          retention-days: 14
