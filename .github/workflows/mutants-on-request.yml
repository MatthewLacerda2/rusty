# Mutation testing on request: exactly the code someone names, on GitHub's
# runners, with a report readable without opening a log (#750).
#
# Pull requests carry no mutation job. Mutation is a signal — nothing it finds
# may block a merge — and the per-PR job held runners the merge queue was
# waiting on, for a report that could not change whether anything merged.
# What replaces it is not silence: whoever just wrote tricky code asks for
# exactly that code to be mutated, and reads the answer.
#
# By hand, the way in is `make mutants-remote SCOPE=...`, which dispatches this
# on the current branch, waits, downloads the report and prints it
# (`.github/scripts/mutants-remote.py`). Or directly, from `gh` or a cloud
# session's GitHub tools (`actions_run_trigger`), with `scope` and optionally
# `request` (`commit` and `pr` are the merge queue's, below):
#
#   gh workflow run mutants-on-request.yml --ref <branch> -f scope='<scope>'
#
# The scope is `diff` (this branch against `origin/main`) or path globs
# (`crates/physics/src/**`), read by `.github/scripts/mutants-scope.py`, whose
# docstring says why both become `--in-diff`, one per cargo workspace the scope
# reaches (the engine's, and a standalone crate such as `tools/lint`, #2201). The scope and the request id
# `make mutants-remote` generates are in the run's name: a dispatch returns no
# run id, so the id is how the command finds *its* run.
#
# Never a gate, never on a pull request and never on a schedule: mutation runs
# only when someone asks, over what they name (CLAUDE.md, *Gates vs.
# signals*); a whole module is audited by asking for its glob. It goes red
# when it has no honest report to give — a path scope with nothing to
# mutate, a hand ask too large to measure, a baseline that does not build — because its caller must tell "no
# survivors" from "no answer", and the run's conclusion is what it reads.
# Survivors are a result and never turn it red.
#
# The merge queue is the usual caller (#1934): a coder writes a `Mutation:`
# line in its pull request, and after the queue merges it, it dispatches this
# on `main` with `commit` (the squash commit, checked out and diffed against
# its parent; globs keep that diff to the files they name, never widen it to
# whole files, #2371) and `pr` (where the report goes), at most two at a time
# (`.github/scripts/merging/after/`). Dispatching at ready, as coders did
# before, held a third of the account's runners on 2026-11-08 while the
# gating `ci` runs waited 20-40 minutes behind them.
#
# When the branch has an open or merged pull request, the report is also
# posted on it, as one comment each later run edits in place (#912): a cloud
# coder ends at ready and is gone before its run finishes, the queue has often
# merged the branch by then, and the pull request is where the orchestrator
# and the reviewer look.
#
# A `workflow_dispatch` workflow can be dispatched only once the file is on
# the default branch; `--ref` then picks the code it runs against.
name: mutants-on-request
run-name: "mutants: ${{ inputs.scope }} [${{ inputs.request }}]"

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "`diff`, or path globs separated by spaces or commas (crates/physics/src/**)"
        required: true
        type: string
      request:
        description: An id for the caller to find this run by; any short string
        required: false
        default: by-hand
        type: string
      commit:
        description: Mutate this commit's own change, checked out (the merge queue's; globs narrow it)
        required: false
        default: ""
        type: string
      pr:
        description: Post the report on this pull request rather than the branch's
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One run per branch (#1530). Coders used to dispatch a scoped run when they
# readied, and again on each re-brief (the queue dispatches after the merge
# now, #1934, but a by-hand `make mutants-remote` still runs on a branch);
# without this every older run kept its runner for its full course, and on 2026-10-28 ten at once left
# the merge queue's `ci` runs queued for 45 minutes. A newer dispatch on the
# same ref cancels the older run. The group is a literal string, not
# `${{ github.workflow }}`, because `mutants-cancel.yml` joins the same group
# when the branch's pull request closes unmerged, and that is what stops a run
# whose report nobody would read. A merged branch's run finishes and reports.
# `ci.yml` and `lint.yml` use groups of their own (`ci-…`, `lint-…`), so
# nothing here can cancel a gating run.
#
# On `main` each run is its own group (its run id): the merge queue's runs for
# merged pull requests (#1934) and the orchestrator's narrower re-asks
# (`ci-merge`, *Triaging a survivor*) are separate questions, not
# replacements, so one must not cancel another. The queue holds its own runs
# to two at a time, which a concurrency group could not do without
# cancelling the waiting ones.
#
# Concurrency cannot rank runs: GitHub has no priority between workflows on
# hosted runners, and one group for every branch would keep a single pending
# run and silently cancel the other requests. So mutation is held to one run
# per open branch, not to fewer runners than CI needs.
concurrency:
  group: mutants-on-request-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

# Three jobs (#2283): `plan` reads the scope and sizes the run, `mutants`
# measures it on as many runners as the plan needs (one when it is small), and
# `report` merges what they measured into the one comment the asker reads.
env:
  # Each shard's, measured from its job's start: slow setup leaves less, not
  # overtime. `plan` reads it too, to size the shards.
  BUDGET_SECONDS: 9900   # 2 h 45

jobs:
  # Builds nothing: the scope, the plan's size (`cargo mutants --list` answers
  # in seconds) and the shard count, kept as the `mutants-plan` artifact for
  # the other two jobs. A scope it cannot read, a path scope with nothing to
  # mutate, or one too large to measure writes why into that artifact's
  # `report/` and goes red.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      in_scope: ${{ steps.plan.outputs.in_scope }}
      standalone: ${{ steps.plan.outputs.standalone }}
      shards: ${{ steps.size.outputs.shards }}
    steps:
      # Full history: a `diff` scope needs `origin/main` and the merge base.
      # A queue request checks out its squash commit: `main` may have moved since.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      # The tree is `inputs.commit`, which may predate a step or a script this
      # job calls (`install-tool`, #1973; `system-libs`, #2101; `refuse`,
      # #2371): take `.github/actions` and `.github/scripts` from the
      # workflow's own commit, so a request queued before a change to them
      # still runs. The scripts only read git, so they work on an older tree.
      # Before the first local action.
      - name: Shared steps from the workflow's commit
        run: git checkout "$GITHUB_SHA" -- .github/actions .github/scripts
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Install cargo-mutants
        uses: ./.github/actions/install-tool
        with:
          tool: cargo-mutants

      # One plan per cargo workspace the scope reaches (#2201): the engine's,
      # and any directory whose `Cargo.toml` opens its own `[workspace]`
      # (`tools/lint`), each with its own diff beside `plan.json`. Why it
      # could not be read goes to `problem.txt`, for the report.
      - name: What was asked for
        id: resolve
        env:
          SCOPE: ${{ inputs.scope }}
          COMMIT: ${{ inputs.commit }}
        run: |
          python3 .github/scripts/mutants-scope.py resolve "$SCOPE" --commit "$COMMIT" --out plan.json 2> problem.txt \
            || { cat problem.txt >&2; exit 1; }

      # `--list` builds nothing and answers in seconds, so the size of the
      # request and what it covers are known before anything compiles. A
      # standalone part is listed inside its own root (`--dir`), whose diff
      # names its files relative to it.
      - name: How much of it there is to mutate
        id: plan
        run: |
          set -euo pipefail
          # An empty diff (a branch that changed no Rust) plans nothing; it is
          # not handed to cargo-mutants, which refuses an empty `--in-diff`.
          python3 .github/scripts/mutants-scope.py parts plan.json | while read -r slug root diff; do
            [ -s "$diff" ] || continue
            if [ "$root" = . ]; then
              cargo mutants --list --workspace --json --in-diff "$diff" > "planned-$slug.json"
            else
              cargo mutants --list --json --dir "$root" --in-diff "$diff" > "planned-$slug.json"
            fi
          done
          python3 .github/scripts/mutants-scope.py check plan.json > scope.txt \
            || { cat scope.txt; echo "::error::$(tr '\n' ' ' < scope.txt)"; exit 1; }
          cat scope.txt
          count() { python3 -c 'import json,sys; print(sum(p.get("planned", 0) for p in json.load(open("plan.json"))["parts"] if (p["root"] == ".") == (sys.argv[1] == "root")))' "$1"; }
          echo "in_scope=$(count root)" >> "$GITHUB_OUTPUT"
          echo "standalone=$(count standalone)" >> "$GITHUB_OUTPUT"

      # A hand ask naming files whole that plans far more than the cap's
      # runners can measure starts no shard (#2371): it ends here, red, with
      # each file's count from the plan above, so the next ask is narrower.
      # A `diff` (or a commit's globs) is never refused: it runs at the cap.
      - name: Whether one ask can measure it
        id: fits
        run: |
          python3 .github/scripts/mutants-request.py refuse plan.json --budget-seconds "$BUDGET_SECONDS" \
            > refused.txt 2> refuse-error.txt \
            || { cat refused.txt refuse-error.txt; echo "::error::$(head -n1 refused.txt) $(tail -n1 refuse-error.txt)"; exit 1; }

      # As many runners as the engine's part needs to end inside the budget,
      # at most a handful (`mutants-request.py`'s docstring has the figures).
      # A standalone part runs on shard 0 first, so it counts toward the size.
      # The cap is the number of `The shards (K)` steps in `report`.
      - name: How many runners it gets
        id: size
        env:
          PLANNED: ${{ steps.plan.outputs.in_scope }}
          STANDALONE: ${{ steps.plan.outputs.standalone }}
        run: |
          python3 .github/scripts/mutants-request.py shards --planned "$PLANNED" --standalone "$STANDALONE" \
            --budget-seconds "$BUDGET_SECONDS" >> "$GITHUB_OUTPUT" 2> sizing.txt
          echo "Shards: $(cat sizing.txt)." | tee -a "$GITHUB_STEP_SUMMARY"

      # A run with no answer says so (#2201): the scope was unreadable, named
      # nothing to mutate, or was too large to measure (#2371). `report` posts this below the comment's
      # earlier report, never over it, and the run stays red.
      - name: Say why there is no answer
        if: failure()
        env:
          RESOLVE: ${{ steps.resolve.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          FITS: ${{ steps.fits.outcome }}
        run: |
          if [ "$RESOLVE" = failure ]; then why="the scope could not be read: $(cat problem.txt)"
          elif [ "$PLAN" = failure ] && [ -s scope.txt ]; then why="$(cat scope.txt)"
          elif [ "$FITS" = failure ] && [ -s refused.txt ]; then why="$(cat refused.txt)"
          elif [ "$FITS" = failure ]; then why="the size check broke: $(tail -n 3 refuse-error.txt 2>/dev/null | tr '\n' ' ')"
          else why="the run broke before it could plan the mutants."
          fi
          python3 .github/scripts/mutants-report.py --unanswered "$why" --out report

      - name: Keep the plan
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-plan
          path: |
            plan.json
            scope.txt
            scope-*.diff
            planned-*.json
            report/
          if-no-files-found: warn
          retention-days: 14

  # One shard of the plan per runner (`plan`'s matrix; one for a small plan).
  # Each builds and times its own baseline, then mutates its share.
  mutants:
    needs: plan
    if: needs.plan.result == 'success' && (needs.plan.outputs.in_scope != '0' || needs.plan.outputs.standalone != '0')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A shard's runner: the budget below stops every step before this limit,
    # and a job past it (or whose runner died) leaves no artifact, which
    # `report` names as a lost shard.
    timeout-minutes: 180
    env:
      # A missing adapter fails the canary test, so the baseline fails and the
      # run goes red rather than reporting GPU-covered mutants as MISSED (#785).
      RUSTY_REQUIRE_GPU: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # The same tree `plan` read, and its `.github/actions` and
      # `.github/scripts` from the workflow's commit (`plan` says why).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      - name: Shared steps from the workflow's commit
        run: git checkout "$GITHUB_SHA" -- .github/actions .github/scripts
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # Saved by a run on `main` (the merge queue's post-merge dispatch),
          # from shard 0 alone so parallel shards do not race for one key;
          # a branch's run only reads it. rust-cache skips the save on an
          # exact key hit, so the key is re-saved when `Cargo.lock` or the
          # toolchain changes it, as for every other cache here. So only a
          # run that builds the engine's `target/` saves it: a standalone-only
          # plan (`in_scope` 0, Baseline and Mutate skipped) would save
          # `~/.cargo` alone under the key, and every later run would hit it
          # exactly and build cold. `save-if` is read when this step starts,
          # so it tests the plan's count rather than waiting for Baseline
          # (`test_cache_save.py` holds the expression).
          shared-key: mutants
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 0 && needs.plan.outputs.in_scope != '0' }}
      - name: System libs for winit/wgpu builds
        uses: ./.github/actions/system-libs
        with:
          packages: pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      # Mesa's software Vulkan driver, as in `ci.yml` (#489, #785). Without it
      # wgpu finds no adapter, every GPU test skips, and every mutant in code
      # only the GPU tests reach (render, captures) reports MISSED however well
      # it is tested. `RUSTY_REQUIRE_GPU` (job env) turns a lost driver into a
      # failed baseline instead of that silence.
      - name: Software Vulkan driver (lavapipe)
        uses: ./.github/actions/system-libs
        with:
          packages: mesa-vulkan-drivers libvulkan1
      # The machine the Baseline renders on, as `ci.yml`'s `build-test` prints
      # it: llvmpipe compiles shaders for this CPU (#2385).
      - name: Runner CPU
        run: lscpu | grep -E 'Model name|Flags'
      # nextest too: mutants run under it (`--test-tool nextest`, below).
      - name: Install cargo-mutants and cargo-nextest
        uses: ./.github/actions/install-tool
        with:
          tool: cargo-mutants,cargo-nextest
      - name: The plan
        uses: actions/download-artifact@v8
        with:
          name: mutants-plan

      # A standalone workspace's part (`tools/lint`), on the first shard only,
      # before the engine's so the small one is not starved by the large one's
      # budget. It is one package with its own tests (`make test-lint`'s `cargo
      # test`) and no `dev` feature or GPU, so cargo-mutants' own baseline is
      # the right one here (#2164's mismatch is a workspace member's) and sets
      # the timeout itself. Status and outcomes land beside the plan, per part,
      # for the report. When the engine's part has mutants too, a standalone
      # part gets at most half of what is left (#2201): given all of it, the
      # engine's baseline then started with no budget and overran the job's
      # limit, and a job killed at its limit leaves nothing to report.
      # The memory cap and core dumps off as in every mutation step (the
      # *Baseline* step says why): a scanner mutant that loops pushing
      # onto a `Vec` reaches the cap in seconds, and with a core to write it
      # outlived its timeout and took the runner down (#2230). The list is read
      # on fd 3, so cargo-mutants never reads the rest of it as its stdin.
      - name: Standalone workspaces
        if: matrix.shard == 0 && needs.plan.outputs.standalone != '0'
        env:
          ENGINE: ${{ needs.plan.outputs.in_scope }}
        run: |
          set -uo pipefail
          ulimit -v 8388608 -c 0
          python3 .github/scripts/mutants-scope.py parts plan.json --standalone --planned > standalone.txt
          while read -r -u 3 slug root diff; do
            budget=$(( BUDGET_SECONDS - ($(date +%s) - JOB_STARTED) ))
            [ "$ENGINE" = 0 ] || budget=$(( budget / 2 ))
            rc=0
            if [ "$budget" -le 0 ]; then
              echo "::warning::the ${BUDGET_SECONDS}s budget was spent before $root's mutants"
              rc=124
            else
              timeout --signal=INT --kill-after=60s "${budget}s" \
                cargo mutants --dir "$root" --no-shuffle --in-place --output "mutants-$slug" \
                  --in-diff "$diff" || rc=$?
            fi
            echo "$rc" > "status-$slug"
          done 3< standalone.txt

      # The baseline is run here, not by cargo-mutants (`--baseline skip`, #2164):
      # cargo-mutants 27 builds and tests its own baseline with `--package` set
      # to the mutated packages only, whatever `test_workspace` says. A member
      # crate's baseline then timed only that crate's tests and every mutant
      # overran 3x of it (#2160), and a member without a `dev` feature failed
      # it outright (#2155). This step runs the same build each mutant does,
      # then the whole workspace's tests, timed, and the timeout is 3x that
      # test time: a mutant runs a subset of them (`Mutate`), so the whole
      # suite's time bounds every one. `test_baseline.py` (`make scripts`)
      # holds the two commands to
      # cargo-mutants' own arguments. A baseline that fails turns the run red:
      # there is no honest report to give.
      #
      # Under nextest (`--test-tool nextest`, #1844), the gate's runner: a
      # process per test and the `gpu` test group, so the run covers the unit
      # and integration tests as the gates do (not the doctests: nextest doesn't
      # run them, `make test` does). Under plain `cargo test` it broke four times
      # on a test that passed the gate (#1042, #1069, #1337, #1844); runner
      # independence is `cargo-test.yml`'s nightly signal, not this one's.
      # `--fail-fast` overrides the profile's `fail-fast = false` (right for the
      # gate's summary) so a caught mutant stops at its first failing test.
      #
      # `ulimit -v` caps every process at 8 GiB of address space, half the
      # runner's 16 GB (#674), here and in every step that mutates. A mutant
      # that turns a loop infinite *and* allocating (a `Vec::push` that never
      # stops) fills RAM in seconds, long before the per-mutant timeout, and
      # the runner got "received a shutdown signal" with no report. Capped,
      # the test binary dies on its own allocation and cargo-mutants counts
      # the mutant caught, as long as core dumps are off (`-c 0`, #2230): the
      # runner's `systemd-coredump` otherwise writes a core as large as the
      # cap while the process holds its memory, past the test timeout, and a
      # few in a row took a runner down. `test_limits.py` (`make scripts`)
      # holds the two together. The cap is per process, so it holds the
      # runner only while the processes under it cannot sum past its memory:
      # nextest runs a process per test, `test-threads` of them at once (the
      # CPU count, 4, by default), and four mutated tests allocating together
      # would take the runner down at about 4 GiB each. `--test-threads 2`
      # keeps cap times threads at the runner's 16 GB; the `gpu` group already
      # allows only 2 renderers at once, so it costs only CPU-bound tests'
      # overlap. `test_gpu_config.py` (`make scripts`) holds the product.
      #
      # The baseline is held to the budget too (#2201): with none left, or
      # none left once it built, no mutant can run, so the part reads as
      # stopped at its budget (status 124, "nothing measured") rather than
      # building on past the job's limit, where no later step runs to say so.
      - name: Baseline
        id: baseline
        if: needs.plan.outputs.in_scope != '0'
        run: |
          set -euo pipefail
          ulimit -v 8388608 -c 0
          left() { echo $(( BUDGET_SECONDS - ($(date +%s) - JOB_STARTED) )); }
          spent() {
            echo "::warning::the ${BUDGET_SECONDS}s budget ran out $1; no engine mutant ran"
            echo "Baseline: the budget ran out $1, so no engine mutant ran." >> "$GITHUB_STEP_SUMMARY"
            echo 124 > status-root
            exit 0
          }
          bounded() {
            [ "$(left)" -gt 0 ] || spent "$1"
            rc=0
            timeout --signal=INT --kill-after=60s "$(left)s" "${@:2}" || rc=$?
            case $rc in
              0) ;;
              124|137) spent "$1" ;;
              *) echo "after the unmutated tests failed (the Baseline step)" > status-root; exit "$rc" ;;
            esac
          }
          bounded "before the baseline built" cargo nextest run --no-run --verbose --workspace --features=dev
          start=$(date +%s)
          bounded "during the baseline's tests" cargo nextest run --verbose --workspace --features=dev --fail-fast --test-threads 2
          secs=$(( $(date +%s) - start ))
          timeout=$(( secs * 3 > 60 ? secs * 3 : 60 ))
          echo "Baseline: the workspace's tests in ${secs}s, so each mutant's test timeout is ${timeout}s." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "timeout=$timeout" >> "$GITHUB_OUTPUT"

      # One cargo-mutants run per package the plan mutates (#2283;
      # `mutants-request.py`'s docstring has the measurements): `--package P`,
      # tested only by what can see P (`-E 'rdeps(=P)'`) and P's own tests
      # first (the tool config `priority` writes). The build is the
      # baseline's, `--workspace` from `.cargo/mutants.toml`'s
      # `test_workspace`, so a mutant rebuilds only what depends on P. This
      # shard's share of each package is `--shard`, turned by the package's
      # offset in the plan so the whole plan is dealt round-robin.
      #
      # `--features dev` is cargo-mutants' own flag, so it reaches the build
      # phase too: after `--` it reached only the test phase, which then
      # recompiled the workspace with `dev` inside the mutant's test timeout.
      # `--in-place` mutates this checkout, whose `target/` the baseline built,
      # so the first mutant does not rebuild the workspace in a copy. SIGINT at
      # the budget is cargo-mutants' Ctrl-C: it stops cleanly and keeps what it
      # measured. A package reached with no budget left reads as stopped at
      # its budget (124): `timeout 0s` would disable the limit, and a negative
      # one exits 125, read as broken. The list is read on fd 3, so
      # cargo-mutants never reads the rest of it as its stdin.
      #
      # Before a package is mutated, `cargo nextest list` with exactly its
      # mutants' filter and tool config must succeed and select a test
      # (`mutants-request.py tests`): cargo-mutants counts any non-zero nextest
      # exit as caught, so a filter or config nextest refuses would report
      # every mutant caught. A package that fails it is broken: its status says
      # why, and the report counts its mutants as never reached.
      - name: Mutate
        id: mutate
        if: needs.plan.outputs.in_scope != '0'
        env:
          TIMEOUT: ${{ steps.baseline.outputs.timeout }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          # The baseline already wrote `status-root` when it stopped at the budget.
          [ -n "$TIMEOUT" ] || exit 0
          ulimit -v 8388608 -c 0
          python3 .github/scripts/mutants-request.py packages planned-root.json > packages.txt
          while read -r -u 3 pkg offset; do
            out="mutants-root/$pkg"
            mkdir -p "$out"
            python3 .github/scripts/mutants-request.py priority "$pkg" > "$out/priority.toml"
            budget=$(( BUDGET_SECONDS - ($(date +%s) - JOB_STARTED) ))
            filter="rdeps(=$pkg)" config="mutants:$PWD/$out/priority.toml"
            rc=0
            if [ "$budget" -le 0 ]; then
              echo "::warning::the ${BUDGET_SECONDS}s budget was spent before $pkg's mutants"
              rc=124
            elif ! timeout "${budget}s" cargo nextest list --workspace --features dev \
                   -E "$filter" --tool-config-file "$config" --message-format json > "$out/tests.json"; then
              echo "::error::cargo nextest list failed for $pkg's filter and tool config"
              echo "the unmutated \`cargo nextest list\` with its mutants' filter failed" > "$out/status"
              continue
            elif ! [ "$(python3 .github/scripts/mutants-request.py tests < "$out/tests.json")" -gt 0 ] 2>/dev/null; then
              echo "::error::$pkg's filter selects no test"
              echo "its mutants' filter \`$filter\` selects no test" > "$out/status"
              continue
            else
              timeout --signal=INT --kill-after=60s "${budget}s" \
                cargo mutants --package "$pkg" --test-tool nextest --no-shuffle --baseline skip --in-place \
                  --timeout "$TIMEOUT" --features dev --output "$out" \
                  --shard "$(( ((SHARD - offset) % SHARDS + SHARDS) % SHARDS ))/$SHARDS" --sharding round-robin \
                  --in-diff scope-root.diff -- --fail-fast --test-threads 2 \
                  -E "$filter" --tool-config-file "$config" || rc=$?
            fi
            echo "$rc" > "$out/status"
          done 3< packages.txt

      # What this shard measured, for `report` to merge: each run's status,
      # outcomes and survivors' diffs, which is all `report` reads (the logs
      # stay in the job's log). Without it (a runner that died, a job past its
      # limit) `report` names the shard as lost.
      - name: Keep this shard
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: |
            status-*
            mutants-*/mutants.out/outcomes.json
            mutants-*/mutants.out/diff/
            mutants-*/*/status
            mutants-*/*/mutants.out/outcomes.json
            mutants-*/*/mutants.out/diff/
          if-no-files-found: warn
          retention-days: 14

  # The one report (#912): every shard's outcomes merged into the layout
  # `mutants-report.py` reads (`mutants-request.py merge`), rendered, and
  # posted on the branch's open pull request, or its merged one when the
  # queue merged it first (or the one the run names, `pr`), one comment edited
  # in place by each later run; a branch with neither (a run on `main`, a
  # scratch branch, a PR closed unmerged) gets no comment (#912, #1530).
  #
  # A run with no answer says so there too (#2201, #2230): `plan`'s reason, or
  # for a job that left nothing (torn down, past its limit) the step it died
  # in and GitHub's annotation (`mutants-torn-down.py`), posted below the
  # comment's earlier report (`--append`), never over it, and the run stays
  # red. A lost shard is named in the report beside what the others measured.
  # Never on a cancelled run (`!cancelled()`): a superseded dispatch or a pull
  # request closed unmerged (#1530), read by nobody. A shard past
  # `timeout-minutes` reads `cancelled` too, but the run is not cancelled, so
  # it is covered.
  report:
    needs: [plan, mutants]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      # Only this job's token may comment, for the report (#912).
      pull-requests: write
    steps:
      # The workflow's own commit (the default ref), not `inputs.commit`: these
      # are the scripts that know the jobs above.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: The plan
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: mutants-plan
          path: run
      # Each shard by name into its own directory, one step per possible
      # shard (`mutants-request.py`'s `MAX_SHARDS`, held by `test_request.py`):
      # given a `pattern`, `download-artifact` unpacks a lone match flat, so a
      # one-shard run's only shard read as lost.
      - name: The shards (0)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: mutants-shard-0
          path: run/shards/mutants-shard-0
      - name: The shards (1)
        if: contains(fromJSON(needs.plan.outputs.shards || '[]'), 1)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: mutants-shard-1
          path: run/shards/mutants-shard-1
      - name: The shards (2)
        if: contains(fromJSON(needs.plan.outputs.shards || '[]'), 2)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: mutants-shard-2
          path: run/shards/mutants-shard-2
      - name: The shards (3)
        if: contains(fromJSON(needs.plan.outputs.shards || '[]'), 3)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: mutants-shard-3
          path: run/shards/mutants-shard-3

      # Red when there is no answer, or cargo-mutants broke in any part (any
      # status but finished or stopped at its budget), or a shard was lost.
      # The report is still written, the parts that finished beside a section
      # for the broken one (#2201), and is posted.
      - name: Render the report
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          set -uo pipefail
          s="$PWD/.github/scripts"
          mkdir -p run && cd run
          why() { python3 "$s/mutants-torn-down.py" --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --job "$1" \
                    || echo "the $1 job left no report."; }
          unanswered() { python3 "$s/mutants-report.py" --unanswered "$1" --out report; echo "append=--append" >> "$GITHUB_OUTPUT"; }
          rc=0
          if [ -f report/report.md ]; then
            echo "append=--append" >> "$GITHUB_OUTPUT"; rc=1   # `plan` said why
          elif [ "$PLAN" != success ] || [ ! -f plan.json ]; then
            unanswered "$(why plan)"; rc=1
          else
            total=$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1] or "[0]")))' "$SHARDS")
            python3 "$s/mutants-request.py" merge plan.json --shards shards --total "$total" > lost.txt
            while read -r slug k; do
              echo "shard $k left no report: $(why "mutants ($k)")" >> "lost-$slug.txt"
            done < lost.txt
            python3 "$s/mutants-report.py" plan.json scope.txt --out report 2> render-error.txt \
              || { cat render-error.txt >&2; rc=1; }
            [ -f report/report.md ] || unanswered "$(cat render-error.txt)"
          fi
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
          # And in the log, for a caller with no `gh` to download the artifact
          # (a cloud session reads the job log through its GitHub tools).
          cat report/report.md report/survivors.diff 2>/dev/null
          exit "$rc"

      # `continue-on-error`: a comment that could not be posted is a lost
      # delivery, not a lost measurement, and survivors never turn this run
      # red, so neither may this. The report is still in the summary and log.
      - name: Post the report on the pull request
        if: success() || failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ inputs.pr }}
          APPEND: ${{ steps.render.outputs.append }}
        run: |
          [ -f run/report/report.md ] || { echo "no report was written; nothing to post"; exit 0; }
          python3 .github/scripts/mutants-pr-comment.py run/report/report.md $APPEND \
            --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --run-url "$RUN_URL" ${PR:+--pr "$PR"}

      # On a red run too, so `make mutants-remote` prints why it has no answer.
      - name: Keep the report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: run/report/
          if-no-files-found: warn
          retention-days: 14
