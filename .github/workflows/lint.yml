name: lint
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Format check (whole crate; rustfmt follows mod tree)
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tools/lint/Cargo.toml --check
      - name: Size gate (full scan; legacy grandfathered via baseline)
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml
      - name: Clippy (report-only for now)
        run: cargo clippy --no-deps || true
