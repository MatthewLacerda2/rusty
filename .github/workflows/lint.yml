name: lint
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: Format check (whole crate; rustfmt follows mod tree)
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tools/lint/Cargo.toml --check
      - name: Size gate (full scan; legacy grandfathered via baseline)
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml
      - name: Determinism guard (no wall-clock / unseeded RNG in sim modules)
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --determinism
      # Clippy is now a HARD gate: every warning fails CI, for both feature sets.
      # The 50-line function cap (clippy::too_many_lines, configured in clippy.toml)
      # is NOT yet wired in here — it flags ~45 legacy functions and is tracked as a
      # burn-down follow-up. Everything else is clean and enforced.
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Clippy (hard gate, default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (hard gate, dev features)
        run: cargo clippy --all-targets --features dev -- -D warnings
