name: lint
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Run on the merge queue's speculative merge so the lint gate validates the
  # state that will actually land (see ci.yml for the same rationale).
  merge_group:
  # Post-merge on `main` (#482): this is the only run that may save the lint job's
  # cache (see the cache step), so without it every PR's lint job would start
  # cold. It also lints the commit that actually landed.
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs; every other event keys on its own run id and always
# finishes. Same shape and rationale as ci.yml's `concurrency` block (#482).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Markdown-only PRs skip the Rust lint/format/clippy *steps*, but the required
  # `lint` job still RUNS and reports `success` (a job whose steps all skip still
  # succeeds). Skipping the whole job would leave the required check "Expected"
  # under the branch ruleset (skipped ≠ pass), wedging docs-only PRs (issue #218),
  # so we guard the steps on `code` instead. See CLAUDE.md.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - '!**/*.md'

  lint:
    needs: changes
    runs-on: ubuntu-latest
    # Events listed explicitly, as in ci.yml (#480): a bare
    # `github.event.pull_request.draft == false` also matches `push` (null == false).
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'
        with:
          fetch-depth: 0
      - name: Ensure rustfmt + clippy
        if: needs.changes.outputs.code != 'false'
        run: rustup component add rustfmt clippy
      # Only `main` saves (#482) — see the note on ci.yml's first cache step.
      - name: Cache cargo registry + target
        if: needs.changes.outputs.code != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format check (whole crate; rustfmt follows mod tree)
        if: needs.changes.outputs.code != 'false'
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tools/lint/Cargo.toml --check
      - name: Size gate (full scan; legacy grandfathered via baseline)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml
      - name: Determinism guard (no wall-clock / unseeded RNG in sim modules)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --determinism
      - name: Component completeness gate (4 axes per first-class component)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --components
      - name: Editor↔shared-op parity gate (migrated cards route through authoring ops)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --parity
      # Clippy is a HARD gate: every warning fails CI, for both feature sets.
      # The 50-line function cap (clippy::too_many_lines, threshold in clippy.toml)
      # is denied crate-wide in Cargo.toml's [lints] table (#485). The legacy burn-down
      # is complete (#124); the one remaining allow is documented in docs/linting.md.
      # Split a function that grows past the cap — never add a new allow.
      # See docs/linting.md.
      - name: System libs for winit/wgpu builds
        if: needs.changes.outputs.code != 'false'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      - name: Clippy (hard gate, default features)
        if: needs.changes.outputs.code != 'false'
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (hard gate, dev features)
        if: needs.changes.outputs.code != 'false'
        run: cargo clippy --all-targets --features dev -- -D warnings
      # Rustdoc is a HARD gate (#482): `cargo doc` is the Rust API reference agents
      # are pointed at, so a broken intra-doc link or a doc linking a private item
      # fails the PR instead of silently publishing a broken reference. Both
      # feature sets — half the crate (and the dev binaries) is behind `dev`.
      - name: Rustdoc (hard gate, default features)
        if: needs.changes.outputs.code != 'false'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
      - name: Rustdoc (hard gate, dev features)
        if: needs.changes.outputs.code != 'false'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked --features dev
      # The merge helpers' tests (#486): `make mergeable` is the only thing between
      # a red PR and `main` while it has no required checks (#491), so a change
      # that breaks its judgement is a gate failure. Stdlib `unittest`, no build.
      - name: Merge helper tests (.github/scripts)
        if: needs.changes.outputs.code != 'false'
        run: python3 -m unittest discover --start-directory .github/scripts/tests --verbose

  # The single required status check for lint.yml (issue #229) — the lint-workflow
  # analog of ci.yml's `ci-gate`. Branch protection requires this job, not `lint` by
  # name, so a lint job that is later added or skipped can never re-introduce the
  # skipped-required-check deadlock (#218). Passes when `lint` succeeded or was
  # skipped; fails only on a real failure or cancellation. `changes` must SUCCEED
  # (#480): `lint` depends on it, so a failed `changes` skips `lint`, and "skipped
  # passes" alone would report a run where nothing was checked as green.
  lint-gate:
    needs: [changes, lint]
    # `!cancelled()`, not `always()` (#515): see `ci-gate` in ci.yml.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the lint job (success or skipped passes)
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::the changes job concluded '$CHANGES', so the lint job was skipped and nothing was checked"
            exit 1
          fi
          echo "lint job result: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::the lint job concluded '$r'"; exit 1 ;;
            esac
          done
          echo 'lint gate passed (success or skipped)'
