name: lint
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

jobs:
  # Markdown-only PRs skip the Rust lint/format/clippy gates. Gated via job-level
  # `if` (a skipped job still satisfies a required check) rather than workflow
  # `paths-ignore` (which would leave a required check stuck pending). See CLAUDE.md.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - '!**/*.md'

  lint:
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && needs.changes.outputs.code != 'false')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: Format check (whole crate; rustfmt follows mod tree)
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tools/lint/Cargo.toml --check
      - name: Size gate (full scan; legacy grandfathered via baseline)
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml
      - name: Determinism guard (no wall-clock / unseeded RNG in sim modules)
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --determinism
      - name: Component completeness gate (4 axes per built-in component)
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --components
      # Clippy is a HARD gate: every warning fails CI, for both feature sets.
      # The 50-line function cap (clippy::too_many_lines, configured in clippy.toml)
      # is enforced here too: `-W clippy::too_many_lines` turns the lint on and the
      # trailing `-D warnings` promotes it (and everything else) to an error. The ~45
      # legacy offenders carry a `#[allow(clippy::too_many_lines)]` grandfather marker
      # and are burned down in #124; all new/changed code must stay under the cap.
      - name: System libs for winit/wgpu builds
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - name: Clippy (hard gate, default features)
        run: cargo clippy --all-targets -- -W clippy::too_many_lines -D warnings
      - name: Clippy (hard gate, dev features)
        run: cargo clippy --all-targets --features dev -- -W clippy::too_many_lines -D warnings
