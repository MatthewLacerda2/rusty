name: lint
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Post-merge on `main` (#482): this is the only run that may save the lint job's
  # cache (see the cache step), so without it every PR's lint job would start
  # cold. It also lints the commit that actually landed.
  push:
    branches: [main]
  workflow_dispatch:

# Cancel a ready PR's run only when a push supersedes it; every other event keys
# on its own run id and always finishes. Same shape and rationale as ci.yml's
# `concurrency` block (#482, #930).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  # Markdown-only PRs skip the Rust lint/format/clippy *steps*, but the required
  # `lint` job still RUNS and reports `success` (a job whose steps all skip still
  # succeeds). Skipping the whole job would leave the required check "Expected"
  # under the branch ruleset (skipped ≠ pass), wedging docs-only PRs (issue #218),
  # so we guard the steps on `code` instead. See CLAUDE.md.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - '!**/*.md'

  lint:
    needs: changes
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    # Events listed explicitly, as in ci.yml (#480): a bare
    # `github.event.pull_request.draft == false` also matches `push` (null == false).
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    steps:
      # Unguarded (#973): the docrefs step below runs on Markdown-only PRs too.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Not guarded on `code` (#973): a Markdown-only PR is exactly where a stale
      # path, make verb or namespace slips in. Stdlib Python, no build.
      - name: Doc references (paths, make verbs and namespaces the docs name exist)
        run: python3 .github/scripts/docrefs.py
      - name: Ensure rustfmt + clippy
        if: needs.changes.outputs.code != 'false'
        run: rustup component add rustfmt clippy
      # Only `main` saves (#482) — see the note on ci.yml's first cache step.
      - name: Cache cargo registry + target
        if: needs.changes.outputs.code != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format check (whole crate; rustfmt follows mod tree)
        if: needs.changes.outputs.code != 'false'
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tools/lint/Cargo.toml --check
      - name: Size gate (full scan, .rs and .py; nothing grandfathered)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml
      - name: Rules (prefix-group; shared Finding + inline allow)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --rules
      - name: Layering lint (module imports match the declared table; no cycles, no sim leaks)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --layers
      - name: Determinism guard (no wall-clock / unseeded RNG in sim modules)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --determinism
      - name: Dependency-direction guard (sim modules never import render/editor/wgpu/egui)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --direction
      - name: Component completeness gate (4 axes per first-class component)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --components
      - name: Editor↔shared-op parity gate (migrated cards route through authoring ops)
        if: needs.changes.outputs.code != 'false'
        run: cargo run --quiet --manifest-path tools/lint/Cargo.toml -- --parity
      # A dev-dependency turning on a feature the normal build lacks doubles the
      # test build (#552, #979). `cargo tree` only, no build.
      - name: Feature split (no dev-dependency adds a feature the normal build lacks)
        if: needs.changes.outputs.code != 'false'
        run: python3 .github/scripts/feature_split.py
      # Clippy is a HARD gate: every warning fails CI, for every feature set.
      # The 50-line function cap (clippy::too_many_lines, threshold in clippy.toml)
      # is denied crate-wide in Cargo.toml's [lints] table (#485). The legacy burn-down
      # is complete (#124); the one remaining allow is documented in docs/linting.md.
      # Split a function that grows past the cap — never add a new allow.
      # See docs/linting.md.
      - name: System libs for winit/wgpu builds
        if: needs.changes.outputs.code != 'false'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      - name: Clippy (hard gate, default features)
        if: needs.changes.outputs.code != 'false'
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (hard gate, dev features)
        if: needs.changes.outputs.code != 'false'
        run: cargo clippy --all-targets --features dev -- -D warnings
      # The ship path (#431): the standalone player built with no editor and no dev
      # layer. Both runs above have the `editor` feature on (it is default), so this
      # is the only compile that proves egui-free code stays egui-free. A check, not
      # a test run: the tests it would add already run with the editor on.
      - name: Clippy (hard gate, player ship build — no editor)
        if: needs.changes.outputs.code != 'false'
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      # tools/lint is held to the policy it enforces (#935).
      - name: Clippy (hard gate, tools/lint)
        if: needs.changes.outputs.code != 'false'
        run: cargo clippy --manifest-path tools/lint/Cargo.toml --all-targets --locked -- -D warnings
      # Rustdoc is a HARD gate (#482): `cargo doc` is the Rust API reference agents
      # are pointed at, so a broken intra-doc link or a doc linking a private item
      # fails the PR instead of silently publishing a broken reference. Both
      # feature sets — half the crate (and the dev binaries) is behind `dev`.
      - name: Rustdoc (hard gate, default features)
        if: needs.changes.outputs.code != 'false'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
      - name: Rustdoc (hard gate, dev features)
        if: needs.changes.outputs.code != 'false'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked --features dev
      # The merge helpers' tests (#486): `make mergeable` is the merge path's
      # judge, which the ruleset's required checks (#491) cannot replace (they
      # cannot tell a draft's run from a ready one), so a change that breaks its
      # judgement is a gate failure. Stdlib `unittest`, no build.
      - name: Merge helper tests (.github/scripts)
        if: needs.changes.outputs.code != 'false'
        run: python3 -m unittest discover --start-directory .github/scripts/tests --top-level-directory .github/scripts --verbose
      # `make launcher`'s files (#1315): what the desktop entry and the macOS bundle
      # start, and from where. Stdlib `unittest`, no build.
      - name: Launcher tests (tools/launcher)
        if: needs.changes.outputs.code != 'false'
        run: python3 -m unittest discover --start-directory tools/launcher/tests --top-level-directory tools/launcher --verbose

  # The single required status check for lint.yml (issue #229) — the lint-workflow
  # analog of ci.yml's `ci-gate`. `main`'s ruleset (`.github/rulesets/main.json`,
  # #491; see `ci-gate` for what it does not prove) requires this job, not `lint` by
  # name, so a lint job that is later added or skipped can never re-introduce the
  # skipped-required-check deadlock (#218). Passes when `lint` succeeded or was
  # skipped; fails only on a real failure or cancellation. `changes` must SUCCEED
  # (#480): `lint` depends on it, so a failed `changes` skips `lint`, and "skipped
  # passes" alone would report a run where nothing was checked as green.
  lint-gate:
    needs: [changes, lint]
    # `!cancelled()`, not `always()` (#515): see `ci-gate` in ci.yml.
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Gate on the lint job (success or skipped passes)
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::the changes job concluded '$CHANGES', so the lint job was skipped and nothing was checked"
            exit 1
          fi
          echo "lint job result: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::the lint job concluded '$r'"; exit 1 ;;
            esac
          done
          echo 'lint gate passed (success or skipped)'
