# Throwaway diagnostic for #2230: what a job that needs a torn-down job reads.
name: diag-2230
on:
  push:
    branches: [2230-diag-runaway-mutant]
jobs:
  timed-out:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      answered: ${{ steps.a.outputs.answered }}
    steps:
      - run: echo started
      - run: sleep 150
      - id: a
        if: success() || failure()
        run: echo answered=true >> "$GITHUB_OUTPUT"
  killed:
    runs-on: ubuntu-latest
    outputs:
      early: ${{ steps.e.outputs.early }}
      answered: ${{ steps.a.outputs.answered }}
    steps:
      - id: e
        run: echo early=yes >> "$GITHUB_OUTPUT"
      - run: sleep 5; sudo pkill -9 -f Runner.Worker; sudo pkill -9 -f Runner.Listener; sleep 600
      - id: a
        if: success() || failure()
        run: echo answered=true >> "$GITHUB_OUTPUT"
  failed:
    runs-on: ubuntu-latest
    outputs:
      answered: ${{ steps.a.outputs.answered }}
    steps:
      - run: exit 1
      - id: a
        if: success() || failure()
        run: echo answered=true >> "$GITHUB_OUTPUT"
  read:
    needs: [timed-out, killed, failed]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$NEEDS"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | {id,name,status,conclusion,steps:[.steps[]|"\(.number) \(.name) \(.status) \(.conclusion)"]}'
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name != "read") | .id'); do
            echo "annotations of $id:"; gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" --jq '.[] | "\(.annotation_level): \(.message)"'
          done
