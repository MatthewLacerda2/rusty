name: mutants-sweep
# The full mutation sweep of the deterministic sim, weekly (#750). A signal,
# never a gate (CLAUDE.md, *Gates vs. signals*): nothing it finds can block a
# merge, and it runs on no pull request. Between sweeps, mutation runs only
# when someone asks for it, over what they name: `make mutants-remote
# SCOPE=...` dispatches `mutants-on-request.yml`.
#
# Its own workflow, out of `ci.yml` (#750): there it shared the nightly
# schedule `deny` needs, so it ran every night `main` had moved, which during
# a batch is every night. Weekly is the operator's call (2026-10-03): the
# survivor backlog moves slowly, and the report is read when work is planned,
# not after every merge.
#
# `schedule:` fires only from the default branch, and GitHub disables it after
# 60 days without repository activity; check the Actions tab if a week passes
# with no run. A run that fails to *run* (a cut-off shard, a lost runner) files
# itself on the board through `main-health.yml`; survivors stay in the report.
on:
  # Saturdays, 04:41 UTC: off the hour, where GitHub's scheduler is least
  # backed up, clear of `ci.yml`'s nightly run (03:07) and two days clear of
  # `coverage.yml` (Mondays 05:23). `mutants-plan` picks the sweep's width
  # (up to ten runners) so it ends by Sunday 23:59 UTC, and a weekend is when
  # the fewest pull requests want them.
  schedule:
    - cron: '41 4 * * 6'
  workflow_dispatch:
    inputs:
      # Overrides the skip of an already-swept commit (#506), e.g. after
      # changing the sweep itself.
      force:
        description: Sweep even if a finished sweep already covered this commit
        type: boolean
        default: false

# One sweep at a time, repo-wide (#705): a second sweep waits for the first
# instead of taking up to ten more runners. Workflow-level, so the group holds the
# whole run; a group on the `mutants` matrix would serialise its own shards.
# GitHub keeps one pending run per group and a newer one replaces it, which is
# right: it sweeps the newer commit.
concurrency:
  group: mutants-sweep
  cancel-in-progress: false

permissions:
  contents: read

env:
  # What the sweep mutates: the deterministic sim. One list, read by the
  # count in `mutants-plan` and by every shard, so the matrix is sized for
  # exactly the mutants the shards draw from. Space-separated `--file` globs.
  SWEEP_FILES: >-
    src/app/**/*.rs
    src/scripting/**/*.rs
    src/physics/**/*.rs
    src/navigation/**/*.rs

jobs:
  # Decides whether this sweep would measure anything new (#506). In a week
  # with no merges `main` has not moved, and the report of the last *finished*
  # sweep of this commit is still the current answer. "Finished" means
  # `mutants-report` saw every shard complete and wrote `sweep-complete` into
  # its artifact; a sweep with a cut-off shard left mutants unmeasured and does
  # not count. Fails open: if the lookup itself errors, the sweep runs (a wasted
  # weekend beats a silent gap), so a skipped sweep reads as `skipped` — not red
  # — to main-health. `force` bypasses the lookup. On `main` this job goes red
  # only when sizing fails (below): `cargo mutants --workspace --list` errors, the count is
  # zero, or the matrix would pass GitHub's ceiling. main-health then files it
  # on the board like any red run, with the reason in this job's summary.
  # Any ref but `main` is refused, red, before anything else (#972).
  #
  # When it sweeps, it also sizes the matrix (#1684): it counts the mutants
  # (`cargo mutants --workspace --list` builds nothing) and `mutants-shards.py` turns the
  # count into the shard list and the width, from the per-shard rates the
  # newest earlier sweep measured (its `mutants-report` artifact keeps each
  # shard's seconds and outcome lists under `shards/`): shards sized so the
  # slowest rate ends in ≈ 4 h (a shard that measured too few mutants is
  # ignored, and the slowest is capped at a multiple of the mean, so one bad
  # shard cannot push the plan past the ceiling), under the 5 h 40 budget below, and the
  # narrowest `max-parallel` (at most 10) whose waves end by Sunday 23:59 UTC.
  # With no readable earlier report it falls back to `MINUTES_PER_MUTANT`, and
  # the summary names the source it used. The script's docstring has the
  # incidents and the arithmetic. Past GitHub's 256-job matrix ceiling, or with
  # nothing to mutate, this job goes red rather than sweep a capped matrix. A
  # skipped sweep still hands `mutants` a valid matrix (`[0]`) and width, never
  # an empty one, so the skip reads as `skipped`.
  mutants-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read   # list this workflow's past runs and read their artifacts
    outputs:
      sweep: ${{ steps.plan.outputs.sweep }}
      shards: ${{ steps.size.outputs.shards || '[0]' }}
      parallel: ${{ steps.size.outputs.parallel || '1' }}
      minutes: ${{ steps.size.outputs.minutes }}
      mutants: ${{ steps.size.outputs.mutants }}
    steps:
      - name: Look for a finished sweep of this commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          REF: ${{ github.ref }}
        run: |
          decide() {
            echo "sweep=$1" >> "$GITHUB_OUTPUT"
            echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          # `main` only, `force` or not (#972): a dispatch on a branch would hold
          # up to ten runners for a weekend the batch's gates need (#705). Red, so
          # the dispatcher sees the refusal; main-health files only main's runs.
          if [ "$REF" != refs/heads/main ]; then
            decide false "Mutation sweep refused: it sweeps \`main\` only, and this run is on \`$REF\`. Mutate a branch with \`mutants-on-request.yml\` (\`make mutants-remote SCOPE=diff\`)."
            echo "::error::mutants-sweep runs on main only; use mutants-on-request.yml for $REF"
            exit 1
          fi
          if [ "$FORCE" = true ]; then
            decide true "Mutation sweep forced by \`force\`."; exit 0
          fi
          # Newest first; the run in progress is not `completed`, so never matches.
          if ! runs=$(gh api "repos/$REPO/actions/workflows/mutants-sweep.yml/runs?head_sha=$SHA&status=completed&per_page=100" \
                --jq '.workflow_runs[] | "\(.id) \(.html_url)"'); then
            echo '::warning::could not list past runs; sweeping to be safe'
            decide true "Mutation sweep runs: the past-run lookup failed."; exit 0
          fi
          while read -r id url; do
            [ -n "$id" ] || continue
            dir=$(mktemp -d)
            gh run download "$id" -R "$REPO" -n mutants-report -D "$dir" >/dev/null 2>&1 || continue
            if [ -f "$dir/sweep-complete" ]; then
              decide false "Mutation sweep skipped: \`$SHA\` was fully swept by $url — its \`mutants-report\` is still current. Dispatch with \`force\` to re-run."
              exit 0
            fi
          done <<< "$runs"
          decide true "Mutation sweep runs: no finished sweep covers \`$SHA\` yet."
      - uses: actions/checkout@v7
        if: steps.plan.outputs.sweep == 'true'
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.plan.outputs.sweep == 'true'
        run: rustup show
      - name: Install cargo-mutants
        if: steps.plan.outputs.sweep == 'true'
        uses: ./.github/actions/install-tool
        with:
          tool: cargo-mutants
      # The newest earlier sweep's report, for what a mutant cost (#1684). Only
      # its `mutants-report` artifact: a shard's own artifact carries its logs,
      # ≈ 40 MB each. Each attempt downloads into its own directory, and the
      # lookup stops only at a report whose `shards/` holds a rate
      # (`mutants-shards.py has-rate`); a missing report, or one that predates
      # `shards/` or measured nothing, passes to the next older run, and with
      # none `mutants-shards.py` falls back. Never red: a failed lookup sizes
      # from the fallback.
      - name: Read what the last sweep measured
        id: last
        if: steps.plan.outputs.sweep == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          runs=$(gh api "repos/$REPO/actions/workflows/mutants-sweep.yml/runs?branch=main&per_page=20" \
                   --jq ".workflow_runs[] | select(.id != $RUN_ID) | \"\(.id) \(.html_url)\"") \
            || { echo '::warning::could not list past sweeps; sizing from MINUTES_PER_MUTANT'; runs=''; }
          echo "reports=" >> "$GITHUB_OUTPUT"
          while read -r id url; do
            [ -n "$id" ] || continue
            dir=$(mktemp -d)
            gh run download "$id" -R "$REPO" -n mutants-report -D "$dir" >/dev/null 2>&1 || continue
            if python3 .github/scripts/mutants-shards.py has-rate --reports "$dir/shards"; then
              { echo "source=$url"; echo "reports=$dir/shards"; } >> "$GITHUB_OUTPUT"; break
            fi
          done <<< "$runs"
      - name: Size the matrix from the mutant count
        id: size
        if: steps.plan.outputs.sweep == 'true'
        env:
          SOURCE: ${{ steps.last.outputs.source }}
          REPORTS: ${{ steps.last.outputs.reports }}
        run: |
          set -f   # the globs are for cargo-mutants, not the shell
          files=()
          for glob in $SWEEP_FILES; do files+=(--file "$glob"); done
          if ! cargo mutants --workspace --list "${files[@]}" > mutants-list.txt 2> list-error.txt; then
            { echo 'Sizing failed: `cargo mutants --workspace --list` exited non-zero:'; echo '```'
              tail -n 20 list-error.txt; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::cargo mutants --workspace --list failed, so the matrix could not be sized; see the job summary"
            exit 1
          fi
          if ! python3 .github/scripts/mutants-shards.py plan --reports "${REPORTS:-none}" --source "$SOURCE" \
                 < mutants-list.txt > outputs.txt 2> sizing.txt; then
            cat sizing.txt | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::$(cat sizing.txt)"
            exit 1
          fi
          cat outputs.txt >> "$GITHUB_OUTPUT"
          echo "mutants=$(grep -c . mutants-list.txt)" >> "$GITHUB_OUTPUT"
          echo "Matrix: $(cat sizing.txt)." | tee -a "$GITHUB_STEP_SUMMARY"

  # Re-mutates the *entire* deterministic sim (app/scripting/physics/
  # navigation), re-examining code no on-request run was asked about and
  # tracking the survivor backlog (#158–#161).
  #
  # Sharded (#480), and the shard count and width are `mutants-plan`'s, not
  # written here (#1684). Every mutant rebuilds the single crate, then runs the
  # dev suite: 3.7 to 6.7 min a mutant across the shards of 2026-11-07's run
  # (42367735766), setup included. Every hand-set figure was outgrown: ten
  # shards were cut off at 6 h on 2026-10-03 (#749, resized to 24), all 24
  # stopped at their budget on 2026-10-31 (a ~2 min cost never re-measured),
  # and four of 72 on 2026-11-07 (a re-measured 4.3 min mean, while the slow
  # shards ran at 6.7). Now the count is recounted and the cost re-measured
  # every sweep, from the last one's slowest shard (`mutants-shards.py`).
  # `round-robin` spreads each file's mutants over every shard, so no shard
  # draws a whole slow module; a single crate rebuilds fully per mutant
  # regardless, so `slice` sharding's build locality buys nothing.
  # `max-parallel` is the plan's too: the narrowest width, at most 10 (the
  # rest of the account's concurrent jobs belong to pull requests), whose
  # waves of mean-length shards end by Sunday 23:59 UTC, 5 h 24 before
  # `coverage.yml` (Mondays 05:23) cold-builds on the same runners. When even
  # 10 cannot, the plan's summary says so and the sweep runs late: a late
  # sweep beats none. `strategy` may read `needs` (GitHub's context table).
  #
  # Skipped when `mutants-plan` finds a finished sweep of this very commit (#506).
  mutants:
    needs: mutants-plan
    runs-on: ubuntu-latest
    if: needs.mutants-plan.outputs.sweep == 'true'
    continue-on-error: true
    # GitHub's 6 h ceiling, spelled out. The mutation step stops itself before
    # it (`BUDGET_SECONDS`), so a shard that outgrows its slice still uploads
    # what it measured instead of being cancelled with nothing (#749).
    timeout-minutes: 360
    env:
      # Measured from the job's start, not the step's: slow setup leaves less.
      BUDGET_SECONDS: 20400   # 5 h 40
      # A missing adapter fails the canary test, so the baseline fails and the
      # run goes red rather than reporting GPU-covered mutants as MISSED (#785).
      RUSTY_REQUIRE_GPU: "1"
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.mutants-plan.outputs.parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 0 }}
      - name: System libs for winit/wgpu builds
        uses: ./.github/actions/system-libs
        with:
          packages: pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      # Mesa's software Vulkan driver, as in `ci.yml` (#489, #785). Without it
      # wgpu finds no adapter, every GPU test skips, and every mutant in code
      # only the GPU tests reach (render, captures) reports MISSED however well
      # it is tested. `RUSTY_REQUIRE_GPU` (job env) turns a lost driver into a
      # failed baseline instead of that silence.
      - name: Software Vulkan driver (lavapipe)
        uses: ./.github/actions/system-libs
        with:
          packages: mesa-vulkan-drivers libvulkan1
      # nextest too: mutants run under it (`--test-tool nextest`, below).
      - name: Install cargo-mutants and cargo-nextest
        uses: ./.github/actions/install-tool
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Mutation test (one shard of the full deterministic sim, report-only)
        # Build/test with the dev feature so the headless-harness sim tests run
        # too, under nextest, the gate's runner (#1844: a process per test and
        # the `gpu` group, as the gates run the unit and integration tests;
        # nextest runs no doctests, so those are left out here; plain
        # `cargo test` broke it four times, #1042, #1069, #1337, #1844), with
        # `--fail-fast` so a caught mutant stops at its first failing test.
        # Scoped by --file to the sim modules; the timeout multiplier guards
        # against mutants that induce infinite loops. The exit code is recorded
        # so `mutants-report` can tell a finished shard (0 clean, 2 survivors,
        # 3 timeouts) from one stopped at its budget (124/137: what it measured
        # is kept, the rest is unmeasured) or one that never got past its
        # baseline. SIGINT, not `timeout`'s default TERM: it is cargo-mutants'
        # Ctrl-C, which it stops on cleanly, and the per-outcome lists it has
        # been appending to are what the upload keeps.
        #
        # `ulimit -v` caps every process at 8 GiB of address space, half the
        # runner's 16 GB (#674). A mutant that turns a loop infinite *and*
        # allocating (a `Vec::push` that never stops) fills RAM in seconds,
        # long before the per-mutant timeout. That is the likeliest reading of
        # the 2026-10-01 sweep: shard 1's runner got "received a shutdown
        # signal" 4 min into a mutant whose test limit was 172 s, and the shard
        # was lost with no report. Capped, the test binary dies on its own
        # allocation and cargo-mutants counts the mutant caught.
        # The cap is per process, so it holds the runner only as long as the
        # processes under it can't sum past its memory: nextest runs a process
        # per test, `test-threads` of them at once (the CPU count, 4, by
        # default), and four mutated tests allocating together would take the
        # runner down at about 4 GiB each. `--test-threads 2` keeps cap times
        # threads at the runner's 16 GB; the `gpu` group already allows only
        # 2 renderers at once, so it costs only CPU-bound tests' overlap.
        # `test_gpu_config.py` (`make scripts`) holds the product.
        run: |
          budget=$(( BUDGET_SECONDS - ($(date +%s) - JOB_STARTED) ))
          ulimit -v 8388608
          set -f   # the globs are for cargo-mutants, not the shell
          files=()
          for glob in $SWEEP_FILES; do files+=(--file "$glob"); done
          rc=0
          timeout --signal=INT --kill-after=60s "${budget}s" \
            cargo mutants --workspace --test-tool nextest --no-shuffle --timeout-multiplier 3 \
              --shard '${{ matrix.shard }}/${{ strategy.job-total }}' --sharding round-robin \
              "${files[@]}" \
              -- --features dev --fail-fast --test-threads 2 || rc=$?
          mkdir -p mutants.out
          echo "$rc" > mutants.out/exit-code
          # Setup included, as the budget counts it: what the next sweep's
          # plan divides by the mutants measured to size itself (#1684).
          echo $(( $(date +%s) - JOB_STARTED )) > mutants.out/elapsed-seconds
          case "$rc" in
            # Still red (main-health files it): its unmeasured mutants are a real
            # gap. The next sweep sizes from this shard's rate.
            124|137) echo "::warning::shard ${{ matrix.shard }} stopped at its ${budget}s budget; the next sweep sizes from its measured rate" ;;
            # 2 (missed mutants) and 3 (timeouts) are findings, not a failed run:
            # the report job reads them from exit-code, and a red shard would make
            # main-health file "red main" for a signal that worked (#918).
            2|3) rc=0 ;;
          esac
          exit "$rc"
      - name: Record the shard count for the merge job
        if: always()
        run: |
          mkdir -p mutants.out
          echo '${{ strategy.job-total }}' > mutants.out/shard-total
      - name: Upload this shard's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/

  # Merges the shard reports into the one sweep report: a job summary (totals,
  # unfinished shards, the survivor list) and a single `mutants-report` artifact.
  # A shard that did not finish is named, because its mutants are unmeasured —
  # silence from it is not a clean bill.
  mutants-report:
    needs: [mutants-plan, mutants]
    # Runs whenever the sweep ran — even if shards failed — but not when
    # `mutants-plan` skipped it: there is nothing to merge.
    if: always() && needs.mutants.result != 'skipped'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7   # for mutants-shards.py's rate
      - name: Download every shard's report
        uses: actions/download-artifact@v8
        with:
          pattern: mutants-shard-*
          path: shards
      - name: Merge shards and summarize
        env:
          PLANNED: ${{ needs.mutants-plan.outputs.mutants }}
          SIZED_AT: ${{ needs.mutants-plan.outputs.minutes }}
        run: |
          mkdir -p mutants.out
          # Each shard's seconds and outcome lists, kept small, for the next
          # sweep's plan to size from (#1684); the shard artifacts carry logs.
          for dir in shards/mutants-shard-*/; do
            [ -d "$dir" ] || continue   # no shard uploaded: the glob stayed literal
            keep="mutants.out/shards/$(basename "$dir")"
            mkdir -p "$keep"
            for f in elapsed-seconds caught.txt missed.txt timeout.txt unviable.txt; do
              [ -f "$dir$f" ] && cp "$dir$f" "$keep/"
            done
          done
          for kind in caught missed timeout unviable; do
            cat shards/*/"$kind".txt 2>/dev/null | sort > "mutants.out/$kind.txt" || true
          done
          total=$(cat shards/*/shard-total 2>/dev/null | head -n1 || true)
          unfinished=''
          for k in $(seq 0 $(( ${total:-0} - 1 ))); do
            rc=$(cat "shards/mutants-shard-$k/exit-code" 2>/dev/null || echo none)
            case "$rc" in
              0|2|3) ;;
              124|137) unfinished="$unfinished $k(budget)" ;;
              *) unfinished="$unfinished $k(exit:$rc)" ;;
            esac
          done
          count() { grep -c . "mutants.out/$1.txt" || true; }
          measured=$(cat mutants.out/{caught,missed,timeout,unviable}.txt | grep -c . || true)
          {
            echo '### Mutation sweep — full deterministic sim (informational, non-blocking)'
            echo ''
            echo '| caught | missed | timeout | unviable |'
            echo '|---|---|---|---|'
            echo "| $(count caught) | $(count missed) | $(count timeout) | $(count unviable) |"
            echo ''
            echo "Measured $measured of the ${PLANNED:-?} mutants \`mutants-plan\` counted."
            echo ''
            python3 .github/scripts/mutants-shards.py rate --reports mutants.out/shards ${SIZED_AT:+--sized-at "$SIZED_AT"}
            echo ''
            if [ -z "$total" ]; then
              echo '> ❌ No shard uploaded a report — nothing was measured.'
            elif [ -n "$unfinished" ]; then
              echo "> ⚠️ Shards that did not finish (of $total):$unfinished — their remaining mutants are unmeasured, not clean. \`budget\` means the shard stopped itself before the 6 h ceiling: the matrix was sized too small for its slowest shard; the next sweep sizes from the rate above. \`exit:none\` means it was cut off or failed before its run: check its log for a lost runner (\`received a shutdown signal\`, a one-off unless it recurs)."
            else
              echo "> All $total shards finished."
              # The marker `mutants-plan` looks for (#506): this commit is covered.
              echo "$total" > mutants.out/sweep-complete
            fi
            if [ -s mutants.out/missed.txt ]; then
              echo ''
              echo '<details><summary>Surviving mutants</summary>'
              echo ''
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
              echo '</details>'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the merged sweep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: mutants.out/
