name: cargo-test
# TEMPORARY PROBE (#2385): reverted before the PR is ready.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        copy: [0, 1, 2, 3]
    env:
      RUSTY_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: System libs for winit/wgpu builds
        uses: ./.github/actions/system-libs
        with:
          packages: pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      - name: Software Vulkan driver (lavapipe)
        uses: ./.github/actions/system-libs
        with:
          packages: mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build
        run: cargo nextest run --no-run --workspace --features=dev
      - name: The mutation baseline's test command
        run: |
          ulimit -v 8388608 -c 0
          nproc; free -g; df -h .
          cargo nextest run --workspace --features=dev --no-fail-fast --test-threads 2 2>&1 | tee suite.log
      - name: After
        if: always()
        run: |
          grep -E "PROBE|FAIL \[|shaft:" suite.log | head -50 || true
          du -sh ~/.cache/mesa_shader_cache* 2>/dev/null || true
          ls ~/.cache || true
          df -h . ; free -g
