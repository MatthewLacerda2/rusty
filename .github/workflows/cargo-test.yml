name: cargo-test
# TEMPORARY PROBE (#2385): reverted before the PR is ready.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTY_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: System libs for winit/wgpu builds
        uses: ./.github/actions/system-libs
        with:
          packages: pkg-config libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev
      - name: Software Vulkan driver (lavapipe)
        uses: ./.github/actions/system-libs
        with:
          packages: mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build
        run: cargo nextest run --locked -p rusty-render --features dev --no-run
      - name: Probe, fresh renderers
        run: PROBE_N=150 cargo nextest run --locked -p rusty-render --features dev -E 'test(gpu_probe_shaft_stress) | test(gpu_adapter_present_when_required)' --no-capture
      - name: Stress the real test
        if: always()
        run: cargo nextest run --locked -p rusty-render --features dev -E 'test(gpu_a_shadowed_spot_casts_a_shaft_with_a_dark_side)' --stress-count 200
      - name: Stress beside the fog and shadow GPU tests
        if: always()
        run: |
          ulimit -v 8388608 -c 0
          for i in 1 2 3 4 5; do
            cargo nextest run --locked -p rusty-render --features dev --test-threads 2 --no-fail-fast -E 'test(/volumetric_fog::gpu::/) | test(/shadows::.*gpu/)' || echo "ROUND $i FAILED"
          done
