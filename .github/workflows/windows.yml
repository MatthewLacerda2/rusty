name: windows
# The Windows build+test as an informational signal (#741), not a gate. Windows
# is a planned target, not a shipped one (CLAUDE.md, *Ships for macOS and Linux;
# Windows comes later*), so `ci-gate` never `needs:` it and `mergeable.py` reads
# only `ci` and `lint`: a red or slow Windows run here never holds a merge.
#
# It runs nightly on `main`, where `main-health.yml` files the issue when it fails
# to run or goes red, naming the commit range, and on `workflow_dispatch` for a
# branch that touches paths or platform code (`gh workflow run windows.yml --ref
# <branch>`, quoted in its PR). Not on pull requests (#1395): one run per ready PR
# held about a third of the account's concurrent jobs during a batch, and the merge
# queue's gating `ci`/`lint` runs sat queued behind a check nothing waits on. The
# `slash-join` lint rule (#1332) catches the commonest Windows break before any run.
# Not on `push` either: the nightly covers `main`.
on:
  # Off the hour, and off ci.yml's 03:07 deny run.
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

# Each run keeps its own group, so each finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Same steps as ci.yml's `build-test-cross`; bash so Windows runs the same
  # script.
  build-test-windows:
    runs-on: windows-latest
    env:
      # WARP is always there; require it (#489).
      RUSTY_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      # Only `main` writes caches (#482) — here, the nightly run.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test (engine, default)
        shell: bash
        run: |
          rc=0
          cargo nextest run --profile ci --locked || rc=$?
          cp target/nextest/ci/junit.xml junit-default.xml || true
          exit "$rc"
      - name: Test (engine, dev features)
        shell: bash
        run: |
          rc=0
          cargo nextest run --profile ci --features dev --locked || rc=$?
          cp target/nextest/ci/junit.xml junit-dev.xml || true
          exit "$rc"
      - name: Doctests (both feature sets)
        shell: bash
        run: |
          cargo test --doc --locked
          cargo test --doc --features dev --locked
      - name: Test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: junit-*.xml
      - name: Test (lint xtask)
        run: cargo test --manifest-path tools/lint/Cargo.toml --locked
