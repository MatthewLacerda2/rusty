# Dependency bots, kept rare on purpose (#490): merges are serialized, so every
# bot PR costs a full CI slot in the queue. Both ecosystems are grouped into one
# PR each and run monthly.
version: 2
updates:
  # Actions pinned at majors (checkout@v4, rust-cache@v2, …) with nobody watching.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]

  # Semver-compatible updates only — the monthly equivalent of `cargo update`.
  # `lockfile-only` never edits Cargo.toml, so it can only take versions the
  # existing requirements already allow. That is Cargo's rule, which also holds
  # for 0.x crates, where Dependabot's own semver labels would call wgpu
  # 0.19 -> 0.20 a "minor". A major (wgpu/egui/winit…) is a deliberate upgrade
  # issue like #333, never a bot PR; the ignore below says so twice.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    versioning-strategy: "lockfile-only"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-compatible:
        patterns: ["*"]
