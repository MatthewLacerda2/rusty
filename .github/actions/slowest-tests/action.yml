# A suite job's "Slowest tests" step (#1976, #2326, #2350): where the shard's
# time went, and the tests over `slowest_tests.BUDGET` that `main` had under it.
#
# The baseline is `main`'s last three successful `ci` runs that kept every
# shard's JUnit report of this leg and feature set, every shard together, since a
# `count:` partition moves tests between shards (`.github/actions/main-junit`
# says how they are found); the script holds a test to its longest time over all
# of them, since one run cannot tell a slow runner from a slow test. A test merged
# after them reads as new. Nothing found leaves the directory empty and the
# script prints `no baseline: …`. Every step informs and none gates: the caller is
# `continue-on-error`, a `gh` failure only shortens the baseline, and the report
# prints whatever the lookup did. The job needs `actions: read`.
#
# Output `name`: this shard's artifact name (`<prefix>-1of2`), which the job's
# upload step uses, so the name the lookup reads is built in this one file.
name: Slowest tests
description: Print a nextest JUnit report's slowest tests, its group accounting, and the tests newly over the budget against main.
inputs:
  report:
    description: The JUnit report this job wrote.
    required: true
  count:
    description: How many of the slowest tests to print.
    default: "10"
  prefix:
    description: The leg's artifact name before the shard (`junit-build-test-dev`), as the upload step names it.
    required: true
  shard:
    description: This job's `matrix.shard` (`1/2`); its total is how many reports a baseline needs.
    required: true
outputs:
  name:
    description: This shard's JUnit artifact name, for the job's upload step.
    value: ${{ steps.name.outputs.name }}
runs:
  using: composite
  steps:
    - name: Shard's artifact name
      id: name
      shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
        SHARD: ${{ inputs.shard }}
      # `1/2` as `1of2`: `/` is refused in an artifact name.
      run: echo "name=$PREFIX-${SHARD/\//of}" >> "$GITHUB_OUTPUT"
    - name: Main's reports
      uses: ./.github/actions/main-junit
      with:
        prefix: ${{ inputs.prefix }}
        shard: ${{ inputs.shard }}
        dir: ${{ runner.temp }}/slowest-baseline
    - name: Report
      if: always()  # the top N and the accounting print whatever the lookup did
      shell: bash
      env:
        BASE: ${{ runner.temp }}/slowest-baseline
        REPORT: ${{ inputs.report }}
        COUNT: ${{ inputs.count }}
      run: |
        python3 .github/scripts/slowest_tests.py "$REPORT" "$COUNT" --baseline "$BASE"
        python3 .github/scripts/memory_floor.py report mem-floor.txt
