# cargo-nextest configuration (#484). `make test` and CI run the suite through
# nextest; doctests still go through `cargo test --doc` (nextest does not run them).
# docs/testing.md explains the runner; this file only holds its settings.

[profile.default]
# Report every failure in one run: the end-of-run summary is what an agent reads to
# decide what to fix, and stopping at the first failure hides the rest.
fail-fast = false
# No retries. A retried pass is reported as FLAKY but still green, and a flaky test
# is a bug to root-cause, not something to paper over.
retries = 0
# A test past a minute is flagged SLOW; past five it is killed. Nothing in the suite
# comes close (the slowest is seconds), so a kill means a hang — better a named
# timeout than a CI job silently running to GitHub's six-hour ceiling.
slow-timeout = { period = "60s", terminate-after = 5 }
# Print only tests worth reading (slow, retried, failed) plus the summary, not a PASS
# line per test: ~1,800 lines of passes per `make test` is output an agent pays for.
status-level = "slow"

# Tests that build a headless renderer. Under nextest every test is its own process,
# so the in-process budget (crates/render/src/setup/budget.rs, MAX_CONCURRENT_HEADLESS)
# cannot see its neighbours; this group is its nextest equivalent, with the same cap.
[test-groups]
gpu = { max-threads = 2 }

# Which tests are GPU tests is a naming rule, enforced at runtime: a test that builds
# a headless renderer without matching this filter panics and names the rule
# (`render::setup::gpu_rule`, which also checks that this filter is unchanged).
#   - integration tests: live under `tests/gpu/`, so their path starts with `gpu::`
#     (`kind(test)`: only the integration binary, since rusty-render's own unit tests
#     sit in a `gpu` module too and are not GPU tests by that alone);
#   - in-crate tests:    the test function's name starts with `gpu_`.
[[profile.default.overrides]]
filter = '(kind(test) & test(/^gpu::/)) | test(/(^|::)gpu_[^:]*$/)'
test-group = "gpu"

# Printed after every run, passing too, so each log carries its adapter's values: the
# canary names the adapter the GPU suite rendered on, and each test that holds a GPU
# tolerance prints what it measured (docs/testing.md, *Which adapters*). A new
# tolerance test that prints its values adds itself here.
[[profile.default.overrides]]
filter = """
test(/(^|::)test_gpu::tests::gpu_adapter_present_when_required$/)
| test(/(^|::)reflection_prefilter::gpu::tests::gpu_prefilter_matches_the_cpu_reference/)
| test(/(^|::)taa::gpu::shimmer::gpu_a_turning_glossy_bumpy_sphere_shimmers_less_under_taa_than_fxaa$/)
| test(/(^|::)ssr::gpu::rough::jitter::gpu_a_still_rough_reflection_holds_under_taa_jitter$/)
| test(/(^|::)ssr::gpu::rough::fading::gpu_a_lit_bands_fading_edge_draws_no_line$/)
| test(/(^|::)ssr::gpu::rough::light::gpu_the_radius_field_is_the_same_in_a_dim_scene_as_in_a_bright_one$/)
| test(/(^|::)ssr::gpu::share::gpu_the_spread_pyramid_keeps_a_lone_dark_hits_share_of_its_widest_window$/)
"""
success-output = "final"

# CI: the default profile plus a JUnit report for the job summary. Profiles inherit
# `profile.default`, overrides included.
[profile.ci]
[profile.ci.junit]
path = "junit.xml"
