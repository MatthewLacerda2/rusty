[package]
name = "rusty-dev"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
dev = ["dep:libloading", "dep:scorsese-core", "dep:scorsese-providers", "rusty-ai/dev", "rusty-app/dev", "rusty-asset/dev", "rusty-core/dev", "rusty-navigation/dev", "rusty-physics/dev", "rusty-render/dev", "rusty-scene/dev", "rusty-script/dev", "rusty-shadergen/dev"]

[lints]
workspace = true

[dependencies]
rusty-app = { workspace = true }
rusty-asset = { workspace = true }
rusty-components = { workspace = true }
rusty-core = { workspace = true }
rusty-logging = { workspace = true }
rusty-navigation = { workspace = true }
rusty-physics = { workspace = true }
rusty-preview = { workspace = true }
rusty-render = { workspace = true }
rusty-scene = { workspace = true }
rusty-script = { workspace = true }
rusty-shadergen = { workspace = true }
rusty-time = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
libloading = { workspace = true, optional = true }
log = { workspace = true }
mlua = { workspace = true }
pollster = { workspace = true }
scorsese-core = { workspace = true, optional = true }
scorsese-providers = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rusty-ai = { workspace = true }
rusty-test-support = { workspace = true }
